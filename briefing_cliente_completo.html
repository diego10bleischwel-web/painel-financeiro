<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboarding Completo do Cliente - Dualize Digital</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{color-scheme:dark;--bg:#071226;--panel:#121b2c;--panel2:#1a2537;--line:#30445f;--text:#f5f8ff;--muted:#9fb0c8;--blue:#6fb8ff;--cyan:#33d6ff;--green:#6ee7b7;--purple:#8b5cf6;--red:#ff6b6b;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(58,91,180,.35),transparent 34%),linear-gradient(135deg,#081630,#05101e 58%,#071b24);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:26px 18px 40px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}
.brand{display:grid;gap:5px}.brand b{letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc;font-size:12px}.brand h1{margin:0;font-size:clamp(30px,5vw,52px);line-height:.98}.brand p{margin:0;color:var(--muted)}
.save-pill{border:1px solid rgba(111,184,255,.35);background:rgba(18,27,44,.82);border-radius:999px;padding:11px 15px;color:#bfe4ff;box-shadow:0 0 28px rgba(51,214,255,.16)}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:22px 0}
.step{border:1px solid var(--line);background:rgba(18,27,44,.76);border-radius:16px;padding:10px;text-align:center;color:var(--muted);font-size:12px}
.step.active{color:#fff;border-color:rgba(51,214,255,.8);box-shadow:0 0 22px rgba(51,214,255,.18);background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(51,214,255,.18))}
.card{border:1px solid rgba(111,184,255,.35);border-radius:24px;background:linear-gradient(145deg,rgba(22,33,52,.94),rgba(12,22,38,.96));box-shadow:0 22px 70px rgba(0,0,0,.35);overflow:hidden}
.card-head{padding:22px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:14px;align-items:center}.num{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;font-weight:900;color:#06101f}.card-head h2{margin:0;font-size:24px}.card-head p{margin:3px 0 0;color:var(--muted)}
.body{padding:24px;display:grid;gap:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}
label{font-weight:800;color:#dce8ff}.tag{font-size:11px;border-radius:999px;padding:2px 7px;margin-left:6px;background:rgba(255,107,107,.16);color:#ff9c9c}.optional{background:rgba(111,184,255,.12);color:#b8ddff}
.hint{color:var(--muted);font-size:13px;line-height:1.45}
input,textarea,select{width:100%;border:1px solid rgba(111,184,255,.28);border-radius:13px;background:#0b1423;color:#fff;padding:13px 14px;outline:none}
textarea{min-height:104px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(51,214,255,.13)}
.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{border:1px solid rgba(111,184,255,.28);background:#101a2a;border-radius:999px;padding:10px 14px;color:#dbeafe}.choice.active{background:linear-gradient(135deg,#60a5fa,#6ee7b7);color:#06101f;border-color:transparent;font-weight:900}
.note{border:1px solid rgba(255,209,102,.45);background:rgba(255,209,102,.08);border-radius:16px;padding:13px;color:#ffe4a6}.ok-note{border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.08);color:#b9f8da}
details{border:1px solid rgba(111,184,255,.25);background:rgba(18,27,44,.62);border-radius:18px;padding:14px}summary{font-weight:900;color:#8bdcff}li{margin:8px 0;color:#cbd5e1}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:900;color:#06101f;background:linear-gradient(135deg,#7dd3fc,#6ee7b7);box-shadow:0 10px 28px rgba(51,214,255,.18)}.btn.secondary{background:#141f31;color:#dbeafe;border:1px solid rgba(255,255,255,.14);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.checks{display:grid;gap:12px}.check{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(111,184,255,.22);border-radius:14px;padding:12px;background:rgba(15,23,42,.58)}.check input{width:auto;margin-top:2px}
.error{display:none;border:1px solid rgba(255,107,107,.45);background:rgba(255,107,107,.11);color:#ffd1d1;border-radius:14px;padding:12px}.error.show{display:block}
.success{display:none;text-align:center;padding:32px}.success.show{display:grid;gap:12px}.success h2{font-size:34px;margin:0;color:#6ee7b7}
@media(max-width:760px){.top{display:grid}.stepper{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.actions{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#071226 18%);padding-top:18px}.card-head{align-items:flex-start}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <b>Dualize Digital</b>
      <h1>Onboarding Completo do Cliente</h1>
      <p>Um unico formulario para iniciar a operacao e alimentar o Traffic AI.</p>
    </div>
    <div class="save-pill" id="saveStatus">Conectando Firebase...</div>
  </header>

  <nav class="stepper" id="stepper"></nav>
  <section class="card" id="formCard"></section>
  <section class="success" id="successBox">
    <h2>Formulario enviado</h2>
    <p>Recebemos suas informacoes. A equipe Dualize Digital vai conferir os dados e seguir com a configuracao.</p>
  </section>
</main>

<script>
const firebaseConfig={apiKey:"AIzaSyAryTmLH5_kYevS2Zt3csh9eUlA7whkLdE",authDomain:"dualize-projeto.firebaseapp.com",projectId:"dualize-projeto",storageBucket:"dualize-projeto.firebasestorage.app",messagingSenderId:"1098441288739",appId:"1:1098441288739:web:8e210b6d329ee779bc1596"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const params=new URLSearchParams(location.search);
const clean=s=>String(s||'').trim();
const makeId=()=>`onb_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
let clientId=clean(params.get('cliente'))||makeId();
if(!params.get('cliente')){params.set('cliente',clientId);history.replaceState(null,'',`${location.pathname}?${params.toString()}`)}
let current=0,saveTimer=null,loaded=false;
const steps=[
  {key:'identificacao',title:'Identificacao',sub:'Responsavel e empresa'},
  {key:'acessos',title:'Estrutura digital',sub:'Meta e canais'},
  {key:'pagamento',title:'Pagamento',sub:'Forma dos anuncios'},
  {key:'investimento',title:'Investimento',sub:'Valores iniciais'},
  {key:'publico',title:'Publico-alvo',sub:'Dados estrategicos'},
  {key:'confirmacoes',title:'Confirmacoes',sub:'Autorizacoes'}
];
const fields={
  identificacao:{responsavel_nome:'',cpf_responsavel:'',empresa_nome:clean(params.get('empresa'))||'',cnpj:'',whatsapp:'',email:''},
  acessos:{instagram_user:'',instagram_link:'',facebook_page_link:'',business_manager:'',ad_account:'',facebook_page:'',pixel:''},
  pagamento:{metodo:'',cartao_titular:'',cartao_tipo:'',cartao_final:'',cartao_horario:'',pix_valor:'',pix_data:''},
  investimento:{investimento_mensal:'',investimento_inicial:'',metodo_escolhido:''},
  publico:{genero:'',idade_minima:'',idade_maxima:'',regiao:'',resumo_publico:'',quem_compra:'',problema_principal:''},
  confirmacoes:{codigos:false,autorizacao:false,correto:false}
};
let data=JSON.parse(JSON.stringify(fields));
const required=['responsavel_nome','cpf_responsavel','empresa_nome','cnpj','whatsapp','email','metodo','investimento_mensal','investimento_inicial','metodo_escolhido','genero','idade_minima','idade_maxima','regiao','resumo_publico','quem_compra','problema_principal','codigos','autorizacao','correto'];
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function stepHtml(){
  return steps.map((s,i)=>`<button class="step ${i===current?'active':''}" type="button" data-step="${i}"><b>${i+1}</b><br>${esc(s.title)}</button>`).join('');
}
function optionButtons(group,name,opts){
  const val=data[group][name]||'';
  return `<div class="choices" data-choice-group="${group}" data-choice-name="${name}">${opts.map(o=>`<button class="choice ${val===o?'active':''}" type="button" data-choice-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
}
function input(group,name,label,opts={}){
  const value=data[group][name]||'';
  const req=required.includes(name);
  const type=opts.type||'text';
  const tag=req?'<span class="tag">obrigatorio</span>':'<span class="tag optional">opcional</span>';
  return `<div class="field ${opts.full?'full':''}"><label>${label}${tag}</label>${opts.hint?`<div class="hint">${opts.hint}</div>`:''}<input data-field="${name}" data-group="${group}" type="${type}" placeholder="${esc(opts.placeholder||'')}" value="${esc(value)}"></div>`;
}
function textarea(group,name,label,placeholder){
  return `<div class="field full"><label>${label}<span class="tag">obrigatorio</span></label><textarea data-field="${name}" data-group="${group}" placeholder="${esc(placeholder||'')}">${esc(data[group][name]||'')}</textarea></div>`;
}
function render(){
  document.getElementById('stepper').innerHTML=stepHtml();
  const s=steps[current];
  let inner='';
  if(s.key==='identificacao')inner=`${input('identificacao','responsavel_nome','Nome do responsavel',{placeholder:'Nome completo'})}${input('identificacao','cpf_responsavel','CPF do responsavel',{placeholder:'000.000.000-00'})}${input('identificacao','empresa_nome','Nome da empresa',{placeholder:'Nome da empresa'})}${input('identificacao','cnpj','CNPJ',{placeholder:'00.000.000/0000-00'})}${input('identificacao','whatsapp','WhatsApp',{placeholder:'(00) 00000-0000'})}${input('identificacao','email','E-mail',{type:'email',placeholder:'contato@empresa.com'})}`;
  if(s.key==='acessos')inner=`${input('acessos','instagram_user','Instagram usuario ou ID',{placeholder:'@empresa ou ID'})}${input('acessos','instagram_link','Link do Instagram',{placeholder:'https://instagram.com/...'})}${input('acessos','facebook_page_link','Link da pagina do Facebook',{placeholder:'https://facebook.com/...'})}<div class="field full"><label>Tem Business Manager?</label>${optionButtons('acessos','business_manager',['Sim','Nao','Nao sei'])}</div><div class="field"><label>Tem conta de anuncios?</label>${optionButtons('acessos','ad_account',['Sim','Nao','Nao sei'])}</div><div class="field"><label>Tem pagina do Facebook?</label>${optionButtons('acessos','facebook_page',['Sim','Nao','Nao sei'])}</div><div class="field full"><label>Tem Pixel instalado?</label>${optionButtons('acessos','pixel',['Sim','Nao','Nao sei'])}</div><div class="note field full">Nao envie senhas, codigos temporarios, token, numero completo do cartao, CVV ou acesso bancario por este formulario.</div>`;
  if(s.key==='pagamento')inner=`<div class="field full"><label>Forma de pagamento dos anuncios<span class="tag">obrigatorio</span></label>${optionButtons('pagamento','metodo',['Cartao','PIX','Boleto','Ainda nao definido'])}</div>${input('pagamento','cartao_titular','Titular do cartao',{placeholder:'Somente nome do titular'})}<div class="field"><label>Preferencia do cartao</label>${optionButtons('pagamento','cartao_tipo',['Fisico','Virtual','Nao sei'])}</div>${input('pagamento','cartao_final','Final do cartao',{placeholder:'Ultimos 4 digitos, opcional'})}${input('pagamento','cartao_horario','Melhor horario para configuracao acompanhada',{placeholder:'Ex: 14h as 17h'})}${input('pagamento','pix_valor','Valor do primeiro investimento',{placeholder:'R$ 0,00'})}${input('pagamento','pix_data','Data do primeiro deposito',{type:'date'})}<div class="note field full">Por seguranca, nunca informe numero completo do cartao, validade completa, CVV, senha ou codigo recebido por SMS/e-mail.</div>`;
  if(s.key==='investimento')inner=`${input('investimento','investimento_mensal','Investimento mensal em anuncios',{placeholder:'R$ 0,00'})}${input('investimento','investimento_inicial','Investimento inicial disponivel',{placeholder:'R$ 0,00'})}<div class="field full"><label>Metodo escolhido<span class="tag">obrigatorio</span></label>${optionButtons('investimento','metodo_escolhido',['Cartao','PIX','Boleto','Ainda nao definido'])}</div>`;
  if(s.key==='publico')inner=`<div class="field"><label>Genero principal<span class="tag">obrigatorio</span></label>${optionButtons('publico','genero',['Todos','Homens','Mulheres','Nao sei'])}</div>${input('publico','idade_minima','Idade minima',{type:'number',placeholder:'18'})}${input('publico','idade_maxima','Idade maxima',{type:'number',placeholder:'55'})}${input('publico','regiao','Cidade/regiao',{placeholder:'Cidade, estado ou raio de atendimento'})}${textarea('publico','resumo_publico','Resumo do publico-alvo','Quem e a pessoa que queremos atingir?')}${textarea('publico','quem_compra','Quem compra ou decide?','Descreva quem normalmente compra ou aprova a compra.')}${textarea('publico','problema_principal','Principal necessidade/problema','Qual problema, desejo ou urgencia motiva a compra?')}`;
  if(s.key==='confirmacoes')inner=`<details open><summary>Como vamos comecar</summary><ul><li>Conferimos a estrutura Meta e os dados da empresa.</li><li>Validamos forma de pagamento e investimento inicial.</li><li>Usamos o publico-alvo para orientar o Traffic AI e a estrategia.</li><li>Se houver verificacao, ela sera feita com acompanhamento e sem pedir senhas.</li></ul></details><div class="checks"><label class="check"><input data-field="codigos" data-group="confirmacoes" type="checkbox" ${data.confirmacoes.codigos?'checked':''}> Estou ciente de que codigos de verificacao podem ser solicitados somente durante configuracao acompanhada.</label><label class="check"><input data-field="autorizacao" data-group="confirmacoes" type="checkbox" ${data.confirmacoes.autorizacao?'checked':''}> Autorizo o uso das informacoes para configuracao e gestao das campanhas.</label><label class="check"><input data-field="correto" data-group="confirmacoes" type="checkbox" ${data.confirmacoes.correto?'checked':''}> Confirmo que as informacoes preenchidas estao corretas.</label></div><div class="note ok-note">A Dualize Digital nao solicita senha, CVV, token bancario nem codigo temporario por formulario.</div>`;
  document.getElementById('formCard').innerHTML=`<div class="card-head"><div class="num">${current+1}</div><div><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p></div></div><div class="body"><div class="grid">${inner}</div><div class="error" id="errorBox"></div><div class="actions"><button class="btn secondary" id="prevBtn" type="button" ${current===0?'disabled':''}>Voltar</button><button class="btn" id="nextBtn" type="button">${current===steps.length-1?'Enviar formulario':'Salvar e continuar'}</button></div></div>`;
}
function collectFromDom(){
  document.querySelectorAll('[data-field]').forEach(el=>{
    const group=el.dataset.group,field=el.dataset.field;
    data[group][field]=el.type==='checkbox'?el.checked:clean(el.value);
  });
}
function setChoice(btn){
  const wrap=btn.closest('[data-choice-group]');
  data[wrap.dataset.choiceGroup][wrap.dataset.choiceName]=btn.dataset.choiceValue;
  render();
  scheduleSave();
}
function pendingItems(){
  const flat={...data.identificacao,...data.acessos,...data.pagamento,...data.investimento,...data.publico,...data.confirmacoes};
  return required.filter(key=>!flat[key]);
}
function trafficPayload(){
  return {
    identificacao:{empresa:data.identificacao.empresa_nome,produto:'--',tipo:'--',nicho:data.publico.problema_principal||data.publico.resumo_publico,idioma:'Portugues (BR)',pais:'Brasil',link:data.acessos.instagram_link||data.acessos.facebook_page_link||'--'},
    avatar:{descricao:data.publico.resumo_publico,profissao_tipica:data.publico.quem_compra,idade_minima:data.publico.idade_minima,idade_maxima:data.publico.idade_maxima,genero:data.publico.genero,consciencia:'--',dores:data.publico.problema_principal,desejos:data.publico.quem_compra,provas:'--',regiao:data.publico.regiao},
    produto:{o_que_vende:'--',diferencial_unico:'--',diferenciais:'--'},
    financeiro:{budget:data.investimento.investimento_mensal,meta_receita:'--',meta_roas:'auto',ticket:'--'}
  };
}
async function saveProgress(final=false){
  collectFromDom();
  const missing=pendingItems();
  const status=final&&missing.length===0?'concluido':'em_preenchimento';
  const now=new Date().toISOString();
  const doc={
    id:clientId,cliente:clientId,source:'onboarding_completo',status,createdAt:loaded?undefined:now,updatedAt:now,completedAt:status==='concluido'?now:null,
    empresa_nome:data.identificacao.empresa_nome,responsavel_nome:data.identificacao.responsavel_nome,
    formulario:{clienteNovo:{identificacao:data.identificacao,acessos:data.acessos,pagamento:data.pagamento,investimento:data.investimento,confirmacoes:data.confirmacoes},trafficAi:trafficPayload()},
    dados:data,pendingItems:missing
  };
  Object.keys(doc).forEach(k=>doc[k]===undefined&&delete doc[k]);
  await db.collection('onboardings').doc(clientId).set(doc,{merge:true});
  if(status==='concluido'){
    await db.collection('briefings').doc(clientId).set({
      id:clientId,onboardingId:clientId,source:'onboarding_completo',status:'novo',timestamp:Date.now(),updatedAt:now,
      empresa_nome:data.identificacao.empresa_nome,cliente_nome:data.identificacao.empresa_nome,dados:trafficPayload()
    },{merge:true});
  }
  loaded=true;
  document.getElementById('saveStatus').textContent=status==='concluido'?'Concluido e salvo online':'Salvo online';
}
function scheduleSave(){
  document.getElementById('saveStatus').textContent='Salvando online...';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveProgress(false).catch(err=>document.getElementById('saveStatus').textContent='Erro ao salvar: '+err.message),700);
}
function showError(msg){const box=document.getElementById('errorBox');box.textContent=msg;box.classList.add('show')}
async function next(){
  collectFromDom();
  if(current<steps.length-1){await saveProgress(false);current++;render();return}
  const missing=pendingItems();
  if(missing.length){showError('Preencha todos os campos obrigatorios antes de enviar.');return}
  await saveProgress(true);
  document.getElementById('formCard').hidden=true;
  document.getElementById('successBox').classList.add('show');
}
async function load(){
  try{
    const snap=await db.collection('onboardings').doc(clientId).get();
    if(snap.exists){
      const saved=snap.data().dados||{};
      Object.keys(data).forEach(group=>data[group]={...data[group],...(saved[group]||{})});
      loaded=true;
      if(snap.data().status==='concluido'){document.getElementById('formCard').hidden=true;document.getElementById('successBox').classList.add('show')}
    }
    document.getElementById('saveStatus').textContent='Formulario pronto';
  }catch(err){document.getElementById('saveStatus').textContent='Erro Firebase: '+err.message}
  render();
}
document.addEventListener('click',e=>{
  const step=e.target.closest('[data-step]'); if(step){collectFromDom();saveProgress(false).catch(()=>{});current=Number(step.dataset.step);render()}
  const choice=e.target.closest('[data-choice-value]'); if(choice)setChoice(choice);
  if(e.target.id==='prevBtn'){collectFromDom();saveProgress(false).catch(()=>{});current=Math.max(0,current-1);render()}
  if(e.target.id==='nextBtn')next().catch(err=>showError(err.message));
});
document.addEventListener('input',e=>{if(e.target.matches('[data-field]'))scheduleSave()});
document.addEventListener('change',e=>{if(e.target.matches('[data-field]'))scheduleSave()});
load();
</script>
</body>
</html>
