<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Criativos</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--panel2:#f8f9fb;--text:#172033;--muted:#667085;--line:#d8dee8;--brand:#1d4ed8;--brand-soft:#e8f1ff;--ok:#dcfce7;--ok-text:#166534;--warn:#fef3c7;--warn-text:#92400e;--bad:#fee2e2;--bad-text:#991b1b;--purple:#f3e8ff;--purple-text:#6b21a8;--shadow:0 12px 30px rgba(16,24,40,.10)}
[data-theme="dark"]{--bg:#1f2024;--panel:#27282d;--panel2:#1d1e22;--text:#f2f4f7;--muted:#a5adba;--line:#3b3d45;--brand:#60a5fa;--brand-soft:#1d2b40;--shadow:0 14px 32px rgba(0,0,0,.28)}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{display:flex;gap:11px;align-items:center}.logo{width:36px;height:36px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:950}.brand h1{margin:0;font-size:18px}.brand small{display:block;color:var(--muted);font-weight:800}
.top-actions,.actions,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.pill,.tab,.mini{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:900}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:transparent}.pill select{border:0;background:transparent;color:var(--text);font-weight:900;outline:0}.layout{display:grid;grid-template-columns:280px 1fr;min-height:0}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px}.side-title{font-size:12px;color:var(--muted);font-weight:950;text-transform:uppercase}.area-btn,.board-mini{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:9px;text-align:left;border-radius:8px;padding:9px;font-weight:900}.area-btn.active,.board-mini.active{background:var(--brand-soft);color:var(--brand)}.avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#22c55e,#14b8a6);color:#061b12;display:grid;place-items:center;font-weight:950}.main{padding:18px;min-width:0}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar h2{margin:0;font-size:23px}.toolbar p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:800}.tabs{margin-bottom:14px}.tab.active{background:var(--brand-soft);color:var(--brand);border-color:transparent}.summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:14px}.metric,.section,.board-card,.column,.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.metric{padding:14px}.metric b{display:block;font-size:28px}.metric span{color:var(--muted);font-size:12px;font-weight:950;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.section{overflow:hidden;margin-bottom:14px}.section h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}.list{display:grid}.rowitem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.rowitem:last-child{border-bottom:0}.thumb{width:72px;height:54px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;font-weight:950}.thumb img,.thumb video,.cover img,.cover video{width:100%;height:100%;object-fit:cover}.small{font-size:12px;color:var(--muted);font-weight:800;line-height:1.35}.tag{display:inline-flex;border-radius:999px;padding:5px 8px;margin:2px;font-size:11px;font-weight:950;background:var(--panel2);color:var(--muted)}.tag.ok{background:var(--ok);color:var(--ok-text)}.tag.warn{background:var(--warn);color:var(--warn-text)}.tag.bad{background:var(--bad);color:var(--bad-text)}.tag.blue{background:var(--brand-soft);color:var(--brand)}.tag.purple{background:var(--purple);color:var(--purple-text)}.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.board-card{overflow:hidden;text-align:left;padding:0;border-radius:10px}.board-banner{height:74px;background:linear-gradient(135deg,#1f2937,#475467)}[data-theme="dark"] .board-banner{background:linear-gradient(135deg,#0f172a,#334155)}.board-body{padding:13px}.board-body h3{margin:0 0 8px}.calendar-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.calendar-tools select{min-width:180px}.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}.month{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}.day{min-height:520px;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}.month .day{min-height:132px}.day.today{background:var(--brand-soft)}.day h4{margin:0 0 4px;text-align:center;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:13px}.week-card{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);box-shadow:0 8px 16px rgba(16,24,40,.08)}.cover{height:92px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:900;overflow:hidden}.week-card .body,.creative .body{padding:8px;display:grid;gap:6px}.board-view{display:grid;grid-template-rows:auto auto 1fr;gap:14px}.board-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.kanban{height:calc(100vh - 265px);display:flex;gap:12px;overflow:auto}.column{flex:0 0 285px;display:flex;flex-direction:column;max-height:100%;box-shadow:0 8px 18px rgba(16,24,40,.08)}.col-head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--line);font-weight:950}.cards{padding:8px;display:grid;gap:8px;overflow:auto}.creative{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.add-card{margin:0 8px 8px;border:0;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:9px;font-weight:900}.composer{padding:0 8px 8px}.composer textarea{width:100%;min-height:62px;border:2px solid var(--brand);border-radius:8px;padding:10px;background:var(--panel);color:var(--text);resize:vertical}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:40;display:grid;place-items:start center;padding:34px 14px;overflow:auto}.modal.hidden,.hidden{display:none!important}.modal-box{width:min(1050px,100%);background:var(--bg);display:grid;grid-template-columns:1fr 250px;gap:14px;padding:16px;position:relative}.close{position:absolute;right:12px;top:10px;width:34px;height:34px;border:0;border-radius:50%;font-size:22px;background:var(--panel);color:var(--text)}.modal-main{display:grid;gap:12px}.modal-section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.modal-section h4{margin:0 0 10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:950}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--text);font-weight:850}.field textarea{min-height:84px;resize:vertical}.preview{min-height:220px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden}.preview img,.preview video,.preview iframe{width:100%;height:270px;object-fit:cover;border:0}.modal-side{display:grid;align-content:start;gap:8px}.modal-action{border:0;background:var(--panel);color:var(--text);border-radius:8px;padding:10px;text-align:left;font-weight:900}.empty{padding:18px;text-align:center;color:var(--muted);font-weight:850}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:static;border-right:0;border-bottom:1px solid var(--line)}.main{padding:12px}.top,.toolbar,.board-head,.calendar-tools{align-items:flex-start;flex-direction:column}.top-actions,.actions,.btn,.pill{width:100%}.summary{grid-template-columns:repeat(2,1fr)}.grid2,.modal-box,.row2{grid-template-columns:1fr}.week,.month{grid-template-columns:1fr;overflow:visible}.day{min-height:auto;border-right:0;border-bottom:1px solid var(--line)}.kanban{height:auto;min-height:65vh}.column{flex-basis:82vw}.rowitem{grid-template-columns:56px 1fr}.thumb{width:56px;height:46px}.modal{padding:8px}.brand small{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="logo">C</div><div><h1>Controle de Criativos</h1><small>Areas, quadros, lancamentos e campanhas</small></div></div>
    <div class="top-actions">
      <button class="pill" id="syncBtn" type="button">Sync: <span id="syncStatus">local</span></button>
      <button class="btn ghost" id="themeBtn" type="button">Tema claro/escuro</button>
      <button class="btn primary" id="quickCreative" type="button">+ Criativo</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">Areas de trabalho</div>
      <div id="workspaceList"></div>
      <button class="btn ghost" id="addWorkspace" type="button">+ Area</button>
      <div class="side-title">Quadros desta area</div>
      <div id="sideBoards"></div>
      <button class="btn ghost" id="addBoard" type="button">+ Quadro/cliente</button>
    </aside>
    <main class="main">
      <section id="homeView"></section>
      <section id="boardView" class="hidden"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const STORE='criativosState.v6',OLD=['criativosState.v4','criativosState.v2'],SYNC='criativosSyncUrl.v2',PENDING='criativosSyncPending.v2';
let state=loadState(),syncUrl=localStorage.getItem(SYNC)||'',syncTimer=null,activeScreen='home',calendarMode='week',calendarFilter='all',plannerDate=new Date(),selectedDate=iso(new Date()),openCardId=null,composerColumn='';
document.documentElement.dataset.theme=state.theme||'light';
function blank(){return{version:6,theme:'light',workspaces:[{id:1,name:'TRAFEGO PAGO',note:'Clientes e campanhas de trafego pago',boards:[{id:1,name:'Best MultiMarcas',note:''},{id:2,name:'Solido Sentimento',note:''},{id:3,name:'Dualize Digital',note:''}]}],activeWorkspaceId:1,activeBoardId:null,cards:[],nextWorkspaceId:2,nextBoardId:4,nextCardId:1,lastSync:0}}
function loadState(){let raw=null;try{raw=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!raw){for(const k of OLD){try{raw=JSON.parse(localStorage.getItem(k)||'null');if(raw)break}catch(e){}}}return normalize(raw||blank())}
function normalize(s){const b=blank();if(!s.workspaces){const clients=Array.isArray(s.clients)&&s.clients.length?s.clients:b.workspaces[0].boards;s={...b,cards:Array.isArray(s.cards)?s.cards:[],activeWorkspaceId:1,activeBoardId:null,workspaces:[{...b.workspaces[0],boards:clients.map(c=>({id:+c.id,name:c.name||'Cliente',note:c.note||''}))}],nextBoardId:Math.max(1,...clients.map(c=>+c.id||0))+1,nextCardId:s.nextCardId||1,lastSync:s.lastSync||0}}s={...b,...s};s.workspaces=(s.workspaces||b.workspaces).map(w=>({...w,boards:Array.isArray(w.boards)?w.boards:[]}));if(!s.workspaces.length)s.workspaces=b.workspaces;s.activeWorkspaceId=s.workspaces.some(w=>+w.id===+s.activeWorkspaceId)?+s.activeWorkspaceId:+s.workspaces[0].id;const boards=workspace().boards;s.activeBoardId=boards.some(b=>+b.id===+s.activeBoardId)?+s.activeBoardId:null;s.cards=(Array.isArray(s.cards)?s.cards:[]).map(c=>normalizeCard(c));s.nextWorkspaceId=s.nextWorkspaceId||max(s.workspaces)+1;s.nextBoardId=s.nextBoardId||Math.max(1,...s.workspaces.flatMap(w=>w.boards.map(b=>+b.id||0)))+1;s.nextCardId=s.nextCardId||max(s.cards)+1;return s}
function normalizeCard(c){const boardId=+(c.boardId||c.clientId||state?.activeBoardId||1);return{columnId:'ideas',status:'pendente',approvalStatus:'rascunho',campaignState:'inativo',creativeType:'publicado',platform:'',format:'',account:'',audience:'',link:'',mediaUrl:'',storyUrl:'',reelsUrl:'',note:'',dueDate:'',dueTime:'',publishedAt:'',publishedTime:'',comments:[],checklist:[],publishHistory:[],activeHistory:[],archived:false,done:false,...c,boardId}}
function max(a){return a.reduce((m,x)=>Math.max(m,+x.id||0),0)||0}function workspace(){return state.workspaces.find(w=>+w.id===+state.activeWorkspaceId)||state.workspaces[0]}function board(id=state.activeBoardId){return workspace().boards.find(b=>+b.id===+id)||null}function boardName(id){return workspace().boards.find(b=>+b.id===+id)?.name||'Sem quadro'}function boards(){return workspace().boards}function cards(scope='area'){const ids=new Set(boards().map(b=>+b.id));return state.cards.filter(c=>!c.archived&&ids.has(+c.boardId)&&(scope==='area'||+c.boardId===+state.activeBoardId))}
function save(){state.lastSync=Date.now();localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(PENDING,'1');renderSync();scheduleSave()}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function iso(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}function short(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''}function dateLabel(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}):''}function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}function weekDates(d){const s=weekStart(d);return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x})}function monthDates(d){const first=new Date(d.getFullYear(),d.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());return Array.from({length:42},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x})}function media(u,t){if(!u)return false;if(t==='video'&&String(u).startsWith('data:video/'))return true;if(t==='image'&&String(u).startsWith('data:image/'))return true;return t==='video'?/\.(mp4|webm|ogg)(\?|$)/i.test(u):/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u)}
function detect(url){const u=String(url||''),l=u.toLowerCase();if(!u)return{platform:'',format:'',embed:''};if(l.includes('instagram.com')){const m=u.match(/instagram\.com\/(?:reel|reels|p|tv)\/([^/?#]+)/i),f=l.includes('/reel')?'Reel':'Feed';return{platform:'Instagram',format:f,embed:m?`https://www.instagram.com/${f==='Reel'?'reel':'p'}/${m[1]}/embed`:''}}if(l.includes('facebook.com'))return{platform:'Facebook',format:'Feed'};if(l.includes('tiktok.com'))return{platform:'TikTok',format:'Video'};return{platform:'Link',format:'Criativo'}}
function cover(c,small=false){const u=(c.mediaUrl||c.storyUrl||c.reelsUrl||c.link||'').trim(),soc=detect(c.link||u);if(soc.embed&&!small)return`<div class="cover"><iframe src="${esc(soc.embed)}" loading="lazy" style="width:180%;height:330px;border:0;transform:scale(.56);transform-origin:top left;pointer-events:none"></iframe></div>`;if(media(u,'video'))return`<div class="cover"><video src="${esc(u)}" muted controls></video></div>`;if(media(u,'image'))return`<div class="cover"><img src="${esc(u)}"></div>`;return`<div class="cover">${esc(c.format||soc.format||'Sem preview')}</div>`}function thumb(c){const u=(c.mediaUrl||c.storyUrl||c.reelsUrl||c.link||'').trim();if(media(u,'video'))return`<div class="thumb"><video src="${esc(u)}" muted></video></div>`;if(media(u,'image'))return`<div class="thumb"><img src="${esc(u)}"></div>`;return`<div class="thumb">${esc(c.format||'Criativo')}</div>`}
function tag(text,type=''){return`<span class="tag ${type}">${esc(text)}</span>`}function tags(c){return tag(c.platform||detect(c.link).platform||'Rede')+tag(c.format||detect(c.link).format||'Formato')+tag(c.status||'pendente',c.status==='publicado'?'blue':c.status==='agendado'?'warn':c.status==='ajuste'?'bad':'')+tag(c.campaignState==='ativo'?'rodando':'inativo',c.campaignState==='ativo'?'ok':'bad')}
function render(){renderSide();activeScreen==='home'?renderHome():renderBoardView();renderSync()}
function renderSide(){$('#workspaceList').innerHTML=state.workspaces.map(w=>`<button class="area-btn ${+w.id===+state.activeWorkspaceId?'active':''}" data-workspace="${w.id}"><span class="avatar">${esc((w.name||'A')[0])}</span><span>${esc(w.name)}</span></button>`).join('');$('#sideBoards').innerHTML=boards().map(b=>`<button class="board-mini ${+b.id===+state.activeBoardId?'active':''}" data-open-board="${b.id}">${esc(b.name)}</button>`).join('')}
function renderHome(){const cs=cards('area'),ds=calendarMode==='week'?weekDates(plannerDate):monthDates(plannerDate),weekCs=cs.filter(c=>inDates(c,ds)),active=cs.filter(c=>c.campaignState==='ativo'),scheduled=weekCs.filter(c=>c.dueDate&&!c.publishedAt),published=cs.filter(c=>c.publishedAt).sort((a,b)=>String(b.publishedAt).localeCompare(String(a.publishedAt))),pending=cs.filter(c=>['rascunho','revisao','ajuste'].includes(c.approvalStatus));$('#boardView').classList.add('hidden');$('#homeView').classList.remove('hidden');$('#homeView').innerHTML=`<div class="toolbar"><div><h2>${esc(workspace().name)}</h2><p>Visao geral da area, com todos os quadros/clientes.</p></div><div class="actions"><button class="btn primary" data-new-any>+ Agendar criativo</button><button class="btn ghost" data-add-board>+ Quadro</button></div></div><div class="tabs"><button class="tab active">Dashboard e lancamentos</button></div><div class="summary">${metric('Quadros',boards().length)}${metric('Para subir',scheduled.length)}${metric('Rodando',active.length)}${metric('Aprovacao',pending.length)}</div><div class="grid2"><main><div class="section"><h3>Quadros dos clientes</h3><div class="board-grid">${boards().map(boardCard).join('')}</div></div><div class="section"><h3>Calendario geral</h3>${calendarTools()}${calendarHtml(ds,cs,'area')}</div></main><aside><div class="section"><h3>Rodando agora</h3><div class="list">${active.map(row).join('')||empty('Nenhum criativo rodando.')}</div></div><div class="section"><h3>Historico de subida</h3><div class="list">${published.slice(0,12).map(row).join('')||empty('Historico aparece quando marcar como subido.')}</div></div></aside></div>`}
function metric(label,value){return`<div class="metric"><b>${value}</b><span>${label}</span></div>`}function empty(text){return`<div class="empty">${text}</div>`}function boardCard(b){const list=state.cards.filter(c=>!c.archived&&+c.boardId===+b.id),todo=list.filter(c=>c.status!=='publicado').length,run=list.filter(c=>c.campaignState==='ativo').length;return`<button class="board-card" data-open-board="${b.id}"><div class="board-banner"></div><div class="board-body"><h3>${esc(b.name)}</h3><p class="small">${esc(b.note||'Quadro do cliente')}</p>${tag(todo+' pendentes','warn')}${tag(run+' rodando','ok')}</div></button>`}
function calendarTools(){return`<div class="calendar-tools"><div class="actions"><button class="mini" data-prev>${calendarMode==='week'?'Semana':'Mes'} anterior</button><button class="mini" data-today>Hoje</button><button class="mini" data-next>Proximo</button><button class="mini" data-mode="${calendarMode==='week'?'month':'week'}">${calendarMode==='week'?'Ver mes':'Ver semana'}</button></div><select id="calendarFilter"><option value="all">Todos os quadros</option>${boards().map(b=>`<option value="${b.id}" ${String(calendarFilter)===String(b.id)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`}
function inDates(c,ds){const set=new Set(ds.map(iso));return set.has(c.dueDate)||set.has(c.publishedAt)}function calendarHtml(ds,source,scope){const filtered=calendarFilter==='all'?source:source.filter(c=>+c.boardId===+calendarFilter),klass=calendarMode==='week'?'week':'month';return`<div class="${klass}">${ds.map(d=>dayHtml(d,filtered,scope)).join('')}</div>`}
function dayHtml(d,source,scope){const day=iso(d),list=source.filter(c=>c.dueDate===day||c.publishedAt===day);return`<div class="day ${day===iso(new Date())?'today':''}" data-day="${day}"><h4>${dateLabel(day)}</h4>${list.map(c=>weekCard(c,scope)).join('')||'<div class="small">Sem lancamentos</div>'}</div>`}
function weekCard(c,scope){return`<div class="week-card" draggable="true" data-card="${c.id}">${cover(c,true)}<div class="body"><b>${esc(c.title||'Criativo')}</b><div class="small">${esc(boardName(c.boardId))}</div><div>${tags(c)}</div><button class="mini" data-publish="${c.id}">${c.publishedAt?'Ja subiu':'Marcar subido'}</button></div></div>`}
function row(c){const date=c.publishedAt?`Subiu ${short(c.publishedAt)}`:(c.dueDate?`Subir ${short(c.dueDate)}`:'Sem data');return`<div class="rowitem" data-open-card="${c.id}">${thumb(c)}<div><b>${esc(c.title||'Criativo')}</b><div class="small">${esc(boardName(c.boardId))} - ${date}</div>${tags(c)}</div><button class="mini" data-toggle-run="${c.id}">${c.campaignState==='ativo'?'Desativar':'Ativar'}</button></div>`}
function renderBoardView(){const b=board();if(!b){activeScreen='home';renderHome();return}const cs=cards('board'),ds=weekDates(plannerDate),weekCs=cs.filter(c=>inDates(c,ds)),active=cs.filter(c=>c.campaignState==='ativo'),scheduled=weekCs.filter(c=>c.dueDate&&!c.publishedAt),approval=cs.filter(c=>['rascunho','revisao','ajuste'].includes(c.approvalStatus)),published=cs.filter(c=>c.publishedAt).sort((a,b)=>String(b.publishedAt).localeCompare(String(a.publishedAt)));$('#homeView').classList.add('hidden');$('#boardView').classList.remove('hidden');$('#boardView').innerHTML=`<div class="board-view"><div class="board-head"><div><button class="mini" data-home>Voltar</button><h2>${esc(b.name)}</h2><p class="small">Calendario semanal do cliente, no estilo Reportei Flux.</p></div><div class="actions"><button class="btn primary" data-new-board>+ Agendar criativo</button><button class="mini" data-prev>Semana anterior</button><button class="mini" data-today>Semana atual</button><button class="mini" data-next>Proxima semana</button></div></div><div class="summary">${metric('Para subir semana',scheduled.length)}${metric('Rodando',active.length)}${metric('Aprovacao',approval.length)}${metric('Historico',published.length)}</div><div class="grid2"><main><div class="section"><h3>Lancamentos da semana</h3>${calendarHtml(ds,cs,'board')}</div></main><aside><div class="section"><h3>Rodando agora</h3><div class="list">${active.map(row).join('')||empty('Nenhum criativo rodando.')}</div></div><div class="section"><h3>Historico do cliente</h3><div class="list">${published.slice(0,10).map(row).join('')||empty('Historico aparece quando marcar como subido.')}</div></div></aside></div></div>`}
function columnHtml([id,title],cs){return''}
function cardHtml(c){return`<article class="creative" draggable="true" data-card="${c.id}">${cover(c,true)}<div class="body"><b>${esc(c.title||'Criativo')}</b><div>${tags(c)}</div><div class="small">${c.dueDate?'Agendado '+short(c.dueDate):''}${c.publishedAt?' - Subiu '+short(c.publishedAt):''}</div><div class="actions"><button class="mini" data-open-card="${c.id}">Editar</button><button class="mini" data-publish="${c.id}">${c.publishedAt?'Subido':'Subiu'}</button></div></div></article>`}function composerHtml(id){return`<div class="composer" data-composer="${id}"><textarea placeholder="Titulo ou link, um por linha"></textarea><div class="actions"><button class="btn primary" data-save-composer="${id}">Adicionar</button><button class="mini" data-close-composer>Fechar</button></div></div>`}
function addCardsFromComposer(id){const ta=$(`[data-composer="${id}"] textarea`),lines=(ta?.value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);lines.forEach(line=>createCard({title:/^https?:/i.test(line)?'Criativo colado':line,link:/^https?:/i.test(line)?line:'',boardId:state.activeBoardId||boards()[0]?.id,dueDate:selectedDate}));composerColumn='';save();render()}
function createCard(data={}){const link=data.link||'',soc=detect(link),due=data.dueDate||iso(new Date());state.cards.push({id:state.nextCardId++,boardId:+(data.boardId||state.activeBoardId||boards()[0]?.id),columnId:'scheduled',order:cards('board').length,title:data.title||(soc.format?`${soc.format} ${soc.platform}`:'Novo criativo'),link,mediaUrl:media(link,'image')||media(link,'video')?link:'',platform:soc.platform||'',format:soc.format||'',status:'agendado',approvalStatus:'rascunho',campaignState:'inativo',creativeType:'publicado',dueDate:due,dueTime:'09:00',comments:[],checklist:[],publishHistory:[],activeHistory:[]})}
function openModal(id){openCardId=+id;const c=state.cards.find(x=>+x.id===openCardId);if(!c)return;$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="modal-box"><button class="close" data-close>&times;</button><main class="modal-main"><div class="modal-section"><div class="field"><label>Titulo</label><input id="mTitle" value="${esc(c.title)}"></div></div><div class="modal-section"><h4>Quadro, rede e status</h4><div class="row2"><div class="field"><label>Quadro/cliente</label><select id="mBoard">${boards().map(b=>`<option value="${b.id}" ${+b.id===+c.boardId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select id="mType">${opts(['publicado','darkpost'],c.creativeType)}</select></div><div class="field"><label>Rede</label><select id="mPlatform">${opts(['Instagram','Facebook','TikTok','YouTube','LinkedIn','Link'],c.platform)}</select></div><div class="field"><label>Formato</label><select id="mFormat">${opts(['Feed','Story','Reel','Video','Carrossel','Post'],c.format)}</select></div><div class="field"><label>Status</label><select id="mStatus">${opts(['pendente','ajuste','aprovado','agendado','publicado','pausado'],c.status)}</select></div><div class="field"><label>Aprovacao</label><select id="mApproval">${opts(['rascunho','revisao','ajuste','aprovado'],c.approvalStatus)}</select></div></div></div><div class="modal-section"><h4>Publico e links</h4><div class="row2"><div class="field"><label>Publico</label><input id="mAudience" value="${esc(c.audience)}"></div><div class="field"><label>Link postado</label><input id="mLink" value="${esc(c.link)}"></div></div><div class="field" style="margin-top:10px"><label>Capa/video</label><input id="mMedia" value="${esc(c.mediaUrl)}"><input id="mMediaFile" type="file" accept="image/*,video/*"></div></div><div class="modal-section"><h4>Videos para campanha</h4><div class="row2"><div class="field"><label>Story 9:16</label><input id="mStory" value="${esc(c.storyUrl)}"><input id="mStoryFile" type="file" accept="video/*"></div><div class="field"><label>Reels 9:16</label><input id="mReels" value="${esc(c.reelsUrl)}"><input id="mReelsFile" type="file" accept="video/*"></div></div></div><div class="modal-section"><h4>Preview</h4><div class="preview" id="mPreview">${preview(c)}</div></div><div class="modal-section"><h4>Descricao</h4><div class="field"><textarea id="mNote">${esc(c.note)}</textarea></div></div><div class="modal-section"><h4>Agendamento e subida</h4><div class="row2"><div class="field"><label>Data agendada</label><input id="mDueDate" type="date" value="${esc(c.dueDate)}"></div><div class="field"><label>Hora</label><input id="mDueTime" type="time" value="${esc(c.dueTime)}"></div><div class="field"><label>Subiu em</label><input id="mPublishedAt" type="date" value="${esc(c.publishedAt)}"></div><div class="field"><label>Hora subida</label><input id="mPublishedTime" type="time" value="${esc(c.publishedTime)}"></div></div></div></main><aside class="modal-side"><button class="modal-action" data-save-modal>Salvar</button><button class="modal-action" data-send-approval>Enviar para aprovacao</button><button class="modal-action" data-approve>Aprovar conteudo</button><button class="modal-action" data-schedule-tomorrow>Agendar amanha 09:00</button><button class="modal-action" data-publish="${c.id}">Marcar como subido</button><button class="modal-action" data-toggle-run="${c.id}">${c.campaignState==='ativo'?'Desativar':'Ativar como rodando'}</button><button class="modal-action" data-copy>Copiar card</button><button class="modal-action" data-archive>Arquivar</button></aside></div>`}
function opts(a,v){return a.map(x=>`<option value="${x}" ${x===v?'selected':''}>${x}</option>`).join('')}function preview(c){const u=(c.mediaUrl||c.link||'').trim(),soc=detect(c.link||u);if(soc.embed)return`<iframe src="${esc(soc.embed)}"></iframe>`;if(media(u,'video'))return`<video src="${esc(u)}" controls></video>`;if(media(u,'image'))return`<img src="${esc(u)}">`;return'<div class="empty">Cole link ou envie uma capa/video.</div>'}
function saveModal(){const c=state.cards.find(x=>+x.id===openCardId);if(!c)return;Object.assign(c,{title:$('#mTitle').value.trim()||'Criativo',boardId:+$('#mBoard').value,creativeType:$('#mType').value,platform:$('#mPlatform').value,format:$('#mFormat').value,status:$('#mStatus').value,approvalStatus:$('#mApproval').value,audience:$('#mAudience').value.trim(),link:$('#mLink').value.trim(),mediaUrl:$('#mMedia').value.trim(),storyUrl:$('#mStory').value.trim(),reelsUrl:$('#mReels').value.trim(),note:$('#mNote').value.trim(),dueDate:$('#mDueDate').value,dueTime:$('#mDueTime').value,publishedAt:$('#mPublishedAt').value,publishedTime:$('#mPublishedTime').value});if(c.publishedAt)c.status='publicado';save();render();openModal(c.id)}
function publish(id){const c=state.cards.find(x=>+x.id===+id);if(!c)return;const now=new Date();c.publishedAt=c.dueDate||iso(now);c.publishedTime=c.dueTime||now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});c.status='publicado';c.campaignState='ativo';c.columnId='running';c.publishHistory.push({at:new Date().toISOString(),date:c.publishedAt,time:c.publishedTime});save();render();if(openCardId===+id)openModal(id)}function toggleRun(id){const c=state.cards.find(x=>+x.id===+id);if(!c)return;c.campaignState=c.campaignState==='ativo'?'inativo':'ativo';if(c.campaignState==='ativo'&&!c.publishedAt){publish(id);return}c.activeHistory.push({at:new Date().toISOString(),state:c.campaignState});save();render();if(openCardId===+id)openModal(id)}
function scheduleTomorrow(){const c=state.cards.find(x=>+x.id===openCardId);if(!c)return;const d=new Date();d.setDate(d.getDate()+1);c.dueDate=iso(d);c.dueTime='09:00';c.status='agendado';c.columnId='scheduled';save();render();openModal(c.id)}function readFile(input,target){const file=$(input)?.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{$(target).value=r.result;if(target==='#mMedia')$('#mPreview').innerHTML=preview({mediaUrl:r.result,link:$('#mLink').value})};r.readAsDataURL(file)}
function addWorkspace(){const name=prompt('Nome da area de trabalho:', 'TRAFEGO PAGO');if(!name)return;state.workspaces.push({id:state.nextWorkspaceId++,name,note:'',boards:[]});state.activeWorkspaceId=max(state.workspaces);state.activeBoardId=null;save();activeScreen='home';render()}function addBoard(){const name=prompt('Nome do quadro/cliente:', 'Novo cliente');if(!name)return;workspace().boards.push({id:state.nextBoardId++,name,note:''});state.activeBoardId=workspace().boards.at(-1).id;save();activeScreen='board';render()}
function renderSync(){$('#syncStatus').textContent=syncUrl?(localStorage.getItem(PENDING)==='1'?'pendente':'salvo'):'local'}function scheduleSave(){if(!syncUrl)return;clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,900)}function jsonp(url){return new Promise((res,rej)=>{const cb='cb_'+Date.now();const s=document.createElement('script');window[cb]=p=>{delete window[cb];s.remove();res(p)};s.onerror=rej;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();document.body.appendChild(s)})}async function saveCloud(){try{const payload={...state,lastSync:Date.now()};const r=await fetch(syncUrl,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({data:payload})});const j=await r.json();if(!j.ok)throw Error();state=normalize(j.data||payload);localStorage.setItem(STORE,JSON.stringify(state));localStorage.removeItem(PENDING);renderSync()}catch(e){localStorage.setItem(PENDING,'1');renderSync()}}async function loadCloud(){try{const r=await jsonp(syncUrl);if(r&&r.data&&+r.data.lastSync>+state.lastSync){state=normalize(r.data);localStorage.setItem(STORE,JSON.stringify(state));localStorage.removeItem(PENDING);render()}else if(localStorage.getItem(PENDING)==='1')saveCloud()}catch(e){renderSync()}}async function configSync(){const url=prompt('Cole a URL do Web App do Apps Script:',syncUrl);if(url===null)return;syncUrl=url.trim();if(syncUrl)localStorage.setItem(SYNC,syncUrl);else localStorage.removeItem(SYNC);if(syncUrl){localStorage.setItem(PENDING,'1');await saveCloud();await loadCloud()}renderSync()}
function bind(){document.body.addEventListener('click',e=>{const ws=e.target.closest('[data-workspace]');if(ws){state.activeWorkspaceId=+ws.dataset.workspace;state.activeBoardId=null;activeScreen='home';save();render()}const ob=e.target.closest('[data-open-board]');if(ob){state.activeBoardId=+ob.dataset.openBoard;activeScreen='board';save();render()}if(e.target.closest('[data-home]')){activeScreen='home';state.activeBoardId=null;save();render()}if(e.target.closest('#addWorkspace'))addWorkspace();if(e.target.closest('#addBoard')||e.target.closest('[data-add-board]'))addBoard();if(e.target.closest('[data-new-any]')||e.target.closest('#quickCreative')){createCard({boardId:boards()[0]?.id,dueDate:selectedDate});save();openModal(state.nextCardId-1)}if(e.target.closest('[data-new-board]')){createCard({boardId:state.activeBoardId,dueDate:selectedDate});save();openModal(state.nextCardId-1)}const add=e.target.closest('[data-add-card]');if(add){composerColumn=add.dataset.addCard;render()}if(e.target.closest('[data-close-composer]')){composerColumn='';render()}const sc=e.target.closest('[data-save-composer]');if(sc)addCardsFromComposer(sc.dataset.saveComposer);const open=e.target.closest('[data-open-card]');if(open&&!e.target.closest('[data-toggle-run]'))openModal(open.dataset.openCard);const pub=e.target.closest('[data-publish]');if(pub)publish(pub.dataset.publish);const tog=e.target.closest('[data-toggle-run]');if(tog)toggleRun(tog.dataset.toggleRun);if(e.target.closest('[data-close]')||e.target.id==='modal'){$('#modal').classList.add('hidden');openCardId=null}if(e.target.closest('[data-save-modal]'))saveModal();if(e.target.closest('[data-send-approval]')){const c=state.cards.find(x=>+x.id===openCardId);c.approvalStatus='revisao';c.status='pendente';save();render();openModal(c.id)}if(e.target.closest('[data-approve]')){const c=state.cards.find(x=>+x.id===openCardId);c.approvalStatus='aprovado';c.status='aprovado';save();render();openModal(c.id)}if(e.target.closest('[data-schedule-tomorrow]'))scheduleTomorrow();if(e.target.closest('[data-copy]')){const c=state.cards.find(x=>+x.id===openCardId),copy={...c,id:state.nextCardId++,title:c.title+' - copia',publishedAt:'',publishedTime:'',campaignState:'inativo'};state.cards.push(copy);save();render();openModal(copy.id)}if(e.target.closest('[data-archive]')){const c=state.cards.find(x=>+x.id===openCardId);c.archived=true;save();$('#modal').classList.add('hidden');render()}if(e.target.closest('[data-prev]')){calendarMode==='week'?plannerDate.setDate(plannerDate.getDate()-7):plannerDate.setMonth(plannerDate.getMonth()-1);render()}if(e.target.closest('[data-next]')){calendarMode==='week'?plannerDate.setDate(plannerDate.getDate()+7):plannerDate.setMonth(plannerDate.getMonth()+1);render()}if(e.target.closest('[data-today]')){plannerDate=new Date();render()}const mode=e.target.closest('[data-mode]');if(mode){calendarMode=mode.dataset.mode;render()}if(e.target.id==='themeBtn'){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();render()}if(e.target.id==='syncBtn')configSync()});document.body.addEventListener('change',e=>{if(e.target.id==='calendarFilter'){calendarFilter=e.target.value;render()}if(e.target.id==='mMediaFile')readFile('#mMediaFile','#mMedia');if(e.target.id==='mStoryFile')readFile('#mStoryFile','#mStory');if(e.target.id==='mReelsFile')readFile('#mReelsFile','#mReels')});document.body.addEventListener('input',e=>{if(e.target.id==='mMedia'||e.target.id==='mLink')$('#mPreview').innerHTML=preview({mediaUrl:$('#mMedia').value,link:$('#mLink').value})});document.body.addEventListener('dblclick',e=>{const c=e.target.closest('[data-card]');if(c)toggleRun(c.dataset.card)});document.body.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(c)e.dataTransfer.setData('card',c.dataset.card)});document.body.addEventListener('dragover',e=>{if(e.target.closest('[data-day]'))e.preventDefault()});document.body.addEventListener('drop',e=>{const id=e.dataTransfer.getData('card'),day=e.target.closest('[data-day]'),c=state.cards.find(x=>+x.id===+id);if(!c)return;if(day){c.dueDate=day.dataset.day;c.status='agendado';selectedDate=c.dueDate}save();render()})}
bind();render();if(syncUrl)loadCloud();
})();
</script>
