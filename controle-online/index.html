function max(a){return a.reduce((m,x)=>Math.max(m,+x.id||0),0)||0}function workspace(){return state.workspaces.find(w=>+w.id===+state.activeWorkspaceId)||state.workspaces[0]}function board(id=state.activeBoardId){return workspace().boards.find(b=>+b.id===+id)||null}function boardName(id){return workspace().boards.find(b=>+b.id===+id)?.name||'Sem quadro'}function boards(){return workspace().boards}function cards(scope='area'){const ids=new Set(boards().map(b=>+b.id));return state.cards.filter(c=>!c.archived&&ids.has(+c.boardId)&&(scope==='area'||+c.boardId===+state.activeBoardId))}

function statusSummaryForCards(list){const today=iso(new Date()),creative=list.filter(c=>!routineType(c)&&(!c.centralManaged||c.centralStatus==='rodando')),overdue=creative.filter(c=>!c.publishedAt&&displayDate(c)&&displayDate(c)<today).length,pending=creative.filter(c=>!c.publishedAt&&(!displayDate(c)||displayDate(c)>=today)).length,running=creative.filter(c=>c.campaignState==='ativo').length;return{overdue,pending,running}}

function centralLinkKey(value){return String(value||'').trim().replace(/\s+/g,'').replace(/[?#].*$/,'').replace(/\/+$/,'').toLowerCase()}
function duplicateCreativeLink(value,ignoreId=0){const key=centralLinkKey(value);return!!key&&state.cards.some(c=>!c.archived&&+c.id!==+ignoreId&&centralLinkKey(c.link)===key)}
function centralCards(status=''){return cards('area').filter(c=>c.centralManaged&&(!status||c.centralStatus===status)).sort((a,b)=>String(b.centralActivatedAt||b.centralCreatedAt||'').localeCompare(String(a.centralActivatedAt||a.centralCreatedAt||''))||(+b.id)-(+a.id))}

const PROMPT_SKILL_CATEGORIES=['PAPEL DA IA','MODO DE TRABALHO','REGRAS OPERACIONAIS','ESCALA','AN\u00c1LISE','FUNIL','NOMENCLATURA','CHECKLIST','BOAS PR\u00c1TICAS','EXCE\u00c7\u00d5ES','INSTRU\u00c7\u00c3O FINAL'];
function promptSkillInferCategory(block){const text=((block?.title||'')+' '+(block?.text||'')).toLowerCase();if(text.includes('funil'))return'FUNIL';if(text.includes('escala')||text.includes('orcamento')||text.includes('or\u00e7amento'))return'ESCALA';if(text.includes('analise')||text.includes('an\u00e1lise')||text.includes('m\u00e9trica')||text.includes('metrica'))return'AN\u00c1LISE';if(text.includes('nomenclatura')||text.includes('nomeclatura'))return'NOMENCLATURA';if(text.includes('checklist'))return'CHECKLIST';if(text.includes('exce\u00e7')||text.includes('excec'))return'EXCE\u00c7\u00d5ES';if(text.includes('boas pr\u00e1ticas')||text.includes('boas praticas'))return'BOAS PR\u00c1TICAS';if(text.includes('papel da ia')||text.includes('especialista')||text.includes('estrategista'))return'PAPEL DA IA';if(text.includes('modo de trabalho')||text.includes('processo'))return'MODO DE TRABALHO';if(text.includes('instru\u00e7\u00e3o final')||text.includes('instrucao final'))return'INSTRU\u00c7\u00c3O FINAL';return'REGRAS OPERACIONAIS'}
function ensurePromptSkillState(){if(!state.promptSkillCampaigns)state.promptSkillCampaigns={activeTab:'prompts',promptBlocks:[],skillBlocks:[],updatedAt:''};const ps=state.promptSkillCampaigns;ps.activeTab=ps.activeTab==='skills'?'skills':'prompts';ps.promptBlocks=Array.isArray(ps.promptBlocks)?ps.promptBlocks:[];ps.skillBlocks=Array.isArray(ps.skillBlocks)?ps.skillBlocks:[];ps.promptBlocks.forEach(b=>{if(!PROMPT_SKILL_CATEGORIES.includes(b.category))b.category=promptSkillInferCategory(b);b.priority=Math.min(5,Math.max(1,parseInt(b.priority||4,10)||4))});ps.skillBlocks.forEach(b=>{b.priority=Math.min(5,Math.max(1,parseInt(b.priority||4,10)||4))});return ps}

function promptSkillCleanText(text,compact=false){let out=String(text||'').replace(/\r\n/g,'\n').replace(/[ \t]+$/gm,'').trim();if(!compact)return out;const seen=new Set();return out.split('\n').map(line=>line.trim()).filter(line=>{if(!line)return false;const key=line.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');if(/^(objetivo|aplicar esta regra|titulo|título)\s*:?$/i.test(line))return false;if(seen.has(key))return false;seen.add(key);return true}).join('\n')}
function promptSkillOrderedBlocks(mode='full'){const compact=mode==='compact';return PROMPT_SKILL_CATEGORIES.flatMap(category=>promptSkillBlocks('prompts').filter(b=>(b.category||promptSkillInferCategory(b))===category&&(!compact||Number(b.priority||4)<=4)).map(b=>({...b,category})))}
function promptSkillStageBlock(block,index,compact=false){const title=String(block.title||'Sem titulo'),body=promptSkillCleanText(block.text,compact);return[`ETAPA ${index} - ${block.category}`,`Prompt: ${title}`,'','Tarefa desta etapa:','- Leia somente as regras desta etapa antes de aplicar.','- Execute o que for pedido neste bloco.','- Ao terminar, responda: "Etapa '+index+' concluida" e resuma em 1 a 3 linhas o que foi feito.','- Se faltar informacao, registre a pendencia e continue para a proxima etapa sem apagar nada.','','CONTEUDO DA ETAPA',body||'- Sem conteudo informado.'].join('\n')}
function buildPromptMaster(mode='full'){const compact=mode==='compact',blocks=promptSkillOrderedBlocks(mode),parts=['PROMPT MASTER - DUALIZE CAMPANHAS META ADS','','MODO DE EXECUCAO POR ETAPAS','Você receberá todos os blocos de uma vez, mas deve trabalhar em sequência. Não pule etapas. Não tente resolver tudo em uma única resposta sem conferência.','Para cada etapa abaixo: execute, confira, informe o que foi feito e só então avance para a próxima etapa.','Se houver conflito real dentro da mesma regra operacional, sinalize antes de aplicar. Se forem exemplos, campanhas ou contextos diferentes, não trate como divergência.','','ORDEM OBRIGATORIA','1. PAPEL DA IA','2. MODO DE TRABALHO','3. REGRAS OPERACIONAIS','4. ESCALA','5. ANÁLISE','6. FUNIL','7. NOMENCLATURA','8. CHECKLIST','9. BOAS PRÁTICAS','10. EXCEÇÕES','11. INSTRUÇÃO FINAL','','PROMPTS POR ETAPA'];if(!blocks.length)parts.push('- Nenhum prompt cadastrado ainda.');blocks.forEach((block,i)=>parts.push('\n==================================================\n'+promptSkillStageBlock(block,i+1,compact)+'\n=================================================='));parts.push('\nFECHAMENTO OBRIGATORIO','Ao finalizar todas as etapas, entregue um resumo final com: etapas concluídas, pendências encontradas e próximos ajustes recomendados.');return parts.join('\n')}

function buildSkillMaster(mode='full'){const compact=mode==='compact',blocks=promptSkillBlocks('skills'),warnings=compact?[]:promptSkillWarnings(blocks),parts=['SKILL MASTER - DUALIZE CAMPANHAS META ADS','','Caminho fixo sugerido para salvar/colar skills no Codex: '+PROMPT_SKILL_PATH,'','OBJETIVO','Manter uma biblioteca viva de habilidades, metodos, frameworks e rotinas para melhorar campanhas, analises, criativos e processos de Meta Ads da Dualize Digital.','','COMO USAR','- Leia a skill como procedimento operacional.','- Transforme cada bloco em checklist executavel.','- Preserve nomes, criterios e alertas importantes.','- Quando uma skill conflitar com outra, sinalize a divergencia antes de aplicar.','','SKILLS CADASTRADAS'];if(!blocks.length)parts.push('- Nenhuma skill cadastrada ainda. Adicione metodos na aba Skills.');blocks.forEach((b,i)=>parts.push('\n'+promptSkillDirective(b,i+1,'Skill',compact,new Set())));if(warnings.length)parts.push('\nALERTAS DE CONSISTENCIA PARA REVISAR ANTES DE USAR\n'+warnings.map(w=>'- '+w).join('\n'));parts.push('\nRESULTADO ESPERADO','Ao usar esta skill master, entregue um procedimento claro, com passos, criterios de decisao, exemplos quando necessario e pontos de atencao para nao quebrar o padrao da operacao.');return parts.join('\n')}

function promptSkillList(kind){const blocks=promptSkillBlocks(kind);return`<section class="prompt-skill-panel"><h3>${kind==='skills'?'Skills salvas':'Prompts salvos'}</h3><p class="hint">Lista simples. Clique em editar quando quiser ajustar algo.</p><div class="prompt-skill-list">${blocks.map((b,i)=>`<article class="prompt-skill-card"><strong>${i+1}. ${esc(b.title||'Sem titulo')}</strong><div class="prompt-skill-excerpt">${esc(promptSkillFullText(b.text))}</div><div class="prompt-skill-actions"><button class="mini" data-ps-edit="${b.id}" type="button">Editar</button><button class="mini" data-ps-copy="${b.id}" type="button">Copiar</button><button class="mini danger" data-ps-delete="${b.id}" type="button">Excluir</button></div></article>`).join('')||`<p class="hint">Nenhum item salvo ainda.</p>`}</div></section>`}

function bindTodayNavigation(){document.body.addEventListener('click',e=>{const todayButton=e.target.closest('[data-today]');if(!todayButton)return;e.preventDefault();e.stopImmediatePropagation();const today=iso(new Date());selectedDate=today;plannerDate=new Date(today+'T12:00:00');render();setTimeout(()=>document.querySelector(`[data-day="${today}"]`)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}),80)},true)}
function bindSafeModalPublish(){let hintTimer=null;document.body.addEventListener('click',e=>{const button=e.target.closest('#modal [data-publish]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();button.classList.add('awaiting-double');clearTimeout(hintTimer);hintTimer=setTimeout(()=>button.classList.remove('awaiting-double'),900)},true);document.body.addEventListener('dblclick',e=>{const button=e.target.closest('#modal [data-publish]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();clearTimeout(hintTimer);button.classList.remove('awaiting-double');togglePublished(button.dataset.publish)},true)}
function bindEsc(){document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#modal').classList.contains('hidden')){if(modalDirty&&!confirm('Fechar sem salvar as alteracoes?'))return;const draft=state.cards.find(x=>+x.id===+openCardId&&x.routineDraft);if(draft)state.cards=state.cards.filter(x=>+x.id!==+draft.id);$('#modal').classList.add('hidden');openCardId=null;modalDirty=false;render();return}if(quickDay||quickEditId){quickDay='';quickEditId=null;render();return}if(activeScreen==='board'){activeScreen='home';state.activeBoardId=null;persistLocalOnly();render()}})}
bindTodayNavigation();bindSafeModalPublish();bindOpenEdit();bindBoardEdit();bindHomeCardNav();bindQuick();bindQuickDropPaste();bindRoutine();bindRoutineDoubleChecks();bindDashboardFlash();bindAnalysis();bind();bindDayAdd();bindEsc();enableSyncSafety();setupFirestoreSync();render();syncReady=true;startContinuousSync();if(firestoreReady||syncUrl)syncFromCloud();
})();
