<body>
<div class="app" id="app">

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const STORE='criativosState.v6',OLD=['criativosState.v4','criativosState.v2'],SYNC='criativosSyncUrl.v2',PENDING='criativosSyncPending.v2';
let state=loadState(),syncUrl=localStorage.getItem(SYNC)||'',syncTimer=null,activeScreen='home',calendarMode='month',calendarFilter='all',plannerDate=new Date(),selectedDate=iso(new Date()),openCardId=null,composerColumn='',quickDay='',quickEditId=null,modalTab='titulo',modalDirty=false,showAllHistory=false;
document.documentElement.dataset.theme=state.theme||'light';
function blank(){return{version:6,theme:'light',workspaces:[{id:1,name:'TRAFEGO PAGO',note:'Clientes e campanhas de trafego pago',boards:[{id:1,name:'Best MultiMarcas',note:''},{id:2,name:'Solido Sentimento',note:''},{id:3,name:'Dualize Digital',note:''}]}],activeWorkspaceId:1,activeBoardId:null,cards:[],nextWorkspaceId:2,nextBoardId:4,nextCardId:1,lastSync:0}}
function loadState(){let raw=null;try{raw=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!raw){for(const k of OLD){try{raw=JSON.parse(localStorage.getItem(k)||'null');if(raw)break}catch(e){}}}return normalize(raw||blank())}
function normalize(s){const b=blank();if(!s.workspaces){const clients=Array.isArray(s.clients)&&s.clients.length?s.clients:b.workspaces[0].boards;s={...b,cards:Array.isArray(s.cards)?s.cards:[],activeWorkspaceId:1,activeBoardId:null,workspaces:[{...b.workspaces[0],boards:clients.map(c=>({id:+c.id,name:c.name||'Cliente',note:c.note||''}))}],nextBoardId:Math.max(1,...clients.map(c=>+c.id||0))+1,nextCardId:s.nextCardId||1,lastSync:s.lastSync||0}}s={...b,...s};s.workspaces=(s.workspaces||b.workspaces).map(w=>({...w,boards:Array.isArray(w.boards)?w.boards:[]}));if(!s.workspaces.length)s.workspaces=b.workspaces;s.activeWorkspaceId=s.workspaces.some(w=>+w.id===+s.activeWorkspaceId)?+s.activeWorkspaceId:+s.workspaces[0].id;const activeWorkspace=s.workspaces.find(w=>+w.id===+s.activeWorkspaceId)||s.workspaces[0];const workspaceBoards=activeWorkspace.boards||[];s.activeBoardId=workspaceBoards.some(b=>+b.id===+s.activeBoardId)?+s.activeBoardId:null;const fallbackBoardId=workspaceBoards[0]?.id||1;s.cards=(Array.isArray(s.cards)?s.cards:[]).map(c=>normalizeCard(c,fallbackBoardId));s.nextWorkspaceId=s.nextWorkspaceId||max(s.workspaces)+1;s.nextBoardId=s.nextBoardId||Math.max(1,...s.workspaces.flatMap(w=>w.boards.map(b=>+b.id||0)))+1;s.nextCardId=s.nextCardId||max(s.cards)+1;return s}
function normalizeCard(c,fallbackBoardId=1){const boardId=+(c.boardId||c.clientId||fallbackBoardId);return{columnId:'scheduled',status:'pendente',approvalStatus:'rascunho',campaignState:'inativo',creativeType:'publicado',labels:'',platform:'',format:'',account:'',audience:'',link:'',mediaUrl:'',storyUrl:'',reelsUrl:'',note:'',dueDate:'',dueTime:'',publishedAt:'',publishedTime:'',comments:[],checklist:[],publishHistory:[],activeHistory:[],archived:false,done:false,...c,boardId}}
function max(a){return a.reduce((m,x)=>Math.max(m,+x.id||0),0)||0}function workspace(){return state.workspaces.find(w=>+w.id===+state.activeWorkspaceId)||state.workspaces[0]}function board(id=state.activeBoardId){return workspace().boards.find(b=>+b.id===+id)||null}function boardName(id){return workspace().boards.find(b=>+b.id===+id)?.name||'Sem quadro'}function boards(){return workspace().boards}function cards(scope='area'){const ids=new Set(boards().map(b=>+b.id));return state.cards.filter(c=>!c.archived&&ids.has(+c.boardId)&&(scope==='area'||+c.boardId===+state.activeBoardId))}
function save(){state.lastSync=Date.now();localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(PENDING,'1');renderSync();scheduleSave()}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function iso(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10)}function short(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):''}function dateLabel(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}):''}function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}function weekDates(d){const s=weekStart(d);return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x})}function monthDates(d){const first=new Date(d.getFullYear(),d.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());return Array.from({length:42},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);return x})}function monthTitle(d){return new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,m=>m.toUpperCase())}function media(u,t){if(!u)return false;if(t==='video'&&String(u).startsWith('data:video/'))return true;if(t==='image'&&String(u).startsWith('data:image/'))return true;return t==='video'?/\.(mp4|webm|ogg)(\?|$)/i.test(u):/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u)}
function detect(url){const u=String(url||'').trim(),l=u.toLowerCase();if(!u)return{platform:'',format:'',embed:''};if(l.includes('instagram.com')){const m=u.match(/instagram\.com\/(?:[^/]+\/)*(reel|reels|p|tv)\/([^/?#]+)/i),kind=(m?.[1]||'p').toLowerCase(),f=kind.includes('reel')?'Reel':'Feed';return{platform:'Instagram',format:f,embed:m?`https://www.instagram.com/${f==='Reel'?'reel':'p'}/${m[2]}/embed`:u.replace(/\/?(\?.*)?$/,'/embed')}}if(l.includes('facebook.com'))return{platform:'Facebook',format:'Feed'};if(l.includes('tiktok.com'))return{platform:'TikTok',format:'Video'};return{platform:'Link',format:'Criativo'}}
function cover(c,small=false){const u=(c.mediaUrl||c.storyUrl||c.reelsUrl||c.link||'').trim(),soc=detect(c.link||u);if(soc.embed)return`<div class="cover"><iframe src="${esc(soc.embed)}" loading="eager" scrolling="no" style="width:520px;height:520px;border:0;transform:scale(.23);transform-origin:top left;pointer-events:none;overflow:hidden"></iframe></div>`;if(media(u,'video'))return`<div class="cover"><video src="${esc(u)}" muted controls preload="metadata"></video></div>`;if(media(u,'image'))return`<div class="cover"><img src="${esc(u)}" loading="eager"></div>`;return small?'':`<div class="cover">${esc(c.format||soc.format||'Preview')}</div>`}function thumb(c){const u=(c.mediaUrl||c.storyUrl||c.reelsUrl||c.link||'').trim(),soc=detect(c.link||u);if(soc.embed)return`<div class="thumb"><iframe src="${esc(soc.embed)}" loading="eager" scrolling="no"></iframe></div>`;if(media(u,'video'))return`<div class="thumb"><video src="${esc(u)}" muted preload="metadata"></video></div>`;if(media(u,'image'))return`<div class="thumb"><img src="${esc(u)}" loading="eager"></div>`;return`<div class="thumb">${esc(c.format||soc.format||'Criativo')}</div>`}
function tag(text,type=''){return`<span class="tag ${type}">${esc(text)}</span>`}function labelTags(c){return String(c.labels||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>tag(x,'purple')).join('')}function tags(c){return tag(c.platform||detect(c.link).platform||'Rede')+tag(c.format||detect(c.link).format||'Formato')+tag(c.status||'pendente',c.status==='publicado'?'blue':c.status==='agendado'?'warn':c.status==='ajuste'?'bad':'')+tag(c.campaignState==='ativo'?'rodando':'inativo',c.campaignState==='ativo'?'ok':'bad')+labelTags(c)}
function netClass(c){const p=(c.platform||detect(c.link).platform||'').toLowerCase();if(p.includes('instagram'))return'instagram';if(p.includes('facebook'))return'facebook';if(p.includes('tiktok'))return'tiktok';if(p.includes('youtube'))return'youtube';return''}
function cardAccount(c){return c.account||'@conta'}function cardStatus(c){return c.publishedAt?'publicado':(c.status||'agendado')}function statusPill(c){const s=cardStatus(c);return`<span class="status-pill ${esc(s)}" data-publish="${c.id}" title="Clique para marcar como publicado">${esc(s[0].toUpperCase()+s.slice(1))}</span>`}
function calendarLabels(c){return String(c.labels||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,2).map(x=>`<span class="cal-label">${esc(x)}</span>`).join('')}
function sidebarMark(){return '<div class="side-rail"><span class="side-logo"><img src="dualize-logo-crop.png" alt="Dualize Digital"></span></div>'}
function render(){if(activeScreen==='home'&&boards().length){state.activeBoardId=state.activeBoardId||boards()[0].id;activeScreen='board'}document.body.dataset.screen=activeScreen;renderSide();activeScreen==='home'?renderHome():renderBoardView();renderSync()}
function renderSide(){$('.sidebar').dataset.ready='1';$('#workspaceList').innerHTML=sidebarMark()+state.workspaces.map(w=>`<button class="area-btn ${+w.id===+state.activeWorkspaceId?'active':''}" data-workspace="${w.id}"><span class="avatar">${esc((w.name||'A')[0])}</span><span>${esc(w.name)}</span></button>`).join('');$('#sideBoards').innerHTML=boards().map(b=>`<button class="board-mini ${+b.id===+state.activeBoardId?'active':''}" data-open-board="${b.id}">${esc(b.name)}</button>`).join('')}
function renderHome(){const cs=cards('area'),ds=calendarMode==='week'?weekDates(plannerDate):monthDates(plannerDate),weekCs=cs.filter(c=>inDates(c,ds)),active=cs.filter(c=>c.campaignState==='ativo'),scheduled=weekCs.filter(c=>c.dueDate&&!c.publishedAt),published=cs.filter(c=>c.publishedAt).sort((a,b)=>String(b.publishedAt).localeCompare(String(a.publishedAt))),pending=cs.filter(c=>['rascunho','revisao','ajuste'].includes(c.approvalStatus));$('#boardView').classList.add('hidden');$('#homeView').classList.remove('hidden');$('#homeView').innerHTML=`<div class="toolbar"><div><h2>${esc(workspace().name)}</h2></div><div class="actions"><button class="btn primary" data-new-any>+ Agendar criativo</button></div></div><div class="tabs"><button class="tab active">Dashboard e lancamentos</button></div><div class="summary">${metric('Quadros',boards().length)}${metric('Aguardando',scheduled.length)}${metric('Rodando',active.length)}${metric('Aprovacao',pending.length)}</div><div class="grid2"><main><div class="section"><h3>Quadros dos clientes</h3><div class="board-grid">${boards().map(boardCard).join('')}</div></div><div class="section"><h3>Calendario geral</h3>${calendarTools()}${calendarHtml(ds,cs,'area')}</div></main><aside><div class="section"><h3>Rodando agora</h3><div class="list">${active.map(c=>row(c,'running')).join('')||empty('Nenhum criativo rodando.')}</div></div><div class="section"><h3>Historico de subida <button class="mini history-all" data-history-all>${showAllHistory?'Ver 10':'Ver todos'}</button></h3><div class="list">${published.slice(0,showAllHistory?999:10).map(c=>row(c,'history')).join('')||empty('Historico aparece quando marcar como subido.')}</div></div></aside></div>`}
function metric(label,value){return`<div class="metric"><b>${value}</b><span>${label}</span></div>`}function empty(text){return`<div class="empty">${text}</div>`}function boardCard(b){const list=state.cards.filter(c=>!c.archived&&+c.boardId===+b.id),todo=list.filter(c=>c.status!=='publicado').length,run=list.filter(c=>c.campaignState==='ativo').length;return`<button class="board-card" data-open-board="${b.id}"><div class="board-banner"><img src="dualize-logo-crop.png" alt="Dualize Digital"></div><div class="board-body"><h3>${esc(b.name)}</h3><p class="small">${esc(b.note||'Quadro do cliente')}</p>${tag(todo+' pendentes','warn')}${tag(run+' rodando','ok')}</div></button>`}
function calendarTools(){return`<div class="calendar-tools"><div class="board-cal-title"><b>${monthTitle(plannerDate)}</b><button class="round-nav" data-prev title="Anterior" type="button">&larr;</button><button class="today-chip" data-today type="button">Hoje</button><button class="round-nav" data-next title="Proximo" type="button">&rarr;</button><span class="view-toggle"><button class="mini ${calendarMode==='week'?'active':''}" data-mode="week" type="button">Semanal</button><button class="mini ${calendarMode==='month'?'active':''}" data-mode="month" type="button">Mensal</button></span></div><select id="calendarFilter"><option value="all">Todos os quadros</option>${boards().map(b=>`<option value="${b.id}" ${String(calendarFilter)===String(b.id)?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`}
function displayDate(c){return c.publishedAt||c.dueDate}function cardTime(c){return c.publishedTime||c.dueTime||'99:99'}function orderCards(a,b){return cardTime(a).localeCompare(cardTime(b))||(+a.order||0)-(+b.order||0)||(+a.id||0)-(+b.id||0)}function inDates(c,ds){const set=new Set(ds.map(iso));return set.has(displayDate(c))}function calendarHtml(ds,source,scope){const filtered=calendarFilter==='all'?source:source.filter(c=>+c.boardId===+calendarFilter),klass=scope==='board'?(calendarMode==='month'?'month':'week'):(calendarMode==='week'?'week':'month');return`<div class="${klass} ${scope}-calendar">${ds.map(d=>dayHtml(d,filtered,scope)).join('')}</div>`}
function dayHead(day){const d=new Date(day+'T12:00:00'),isToday=day===iso(new Date()),marked=isToday||day===selectedDate;return`<div class="day-head">${isToday?'<span class="day-today-label">Hoje</span>':''}<span class="day-week">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span><span class="day-num ${marked?'marked':''}">${d.getDate()}</span></div>`}
function dayHtml(d,source,scope){const day=iso(d),list=source.filter(c=>displayDate(c)===day).sort(orderCards),marked=day===selectedDate?'selected':'';return`<div class="day ${day===iso(new Date())?'today':''} ${marked}" data-day="${day}"><h4>${dateLabel(day)}</h4>${scope==='board'?dayHead(day):''}<button class="add-card" data-add-day="${day}" type="button">+ Card</button><div class="day-content">${list.map(c=>weekCard(c,scope)).join('')}</div>${scope==='board'?quickDayHtml(day):''}</div>`}
function quickDayHtml(day){return`<div class="day-foot">${quickDay===day?`<div class="quick-composer" data-quick-day="${day}"><textarea placeholder="Insira um titulo ou cole um link"></textarea><div class="quick-actions"><button class="quick-save" data-quick-save="${day}" type="button">Salvar</button><button class="quick-close" data-quick-close type="button">&times;</button></div></div>`:`<button class="quick-add" data-add-day="${day}" type="button">+ card</button>`}</div>`}
function weekCard(c,scope){const soc=detect(c.link),format=c.format||soc.format||'Feed',time=c.publishedTime||c.dueTime||'09:00',note=(c.note||'').trim(),visual=cover(c,true);if(scope==='board'){if(+quickEditId===+c.id)return`<div class="week-card quick-edit-wrap" data-card="${c.id}"><div class="quick-edit"><textarea>${esc(c.title||'')}</textarea><div class="quick-actions"><button class="quick-save" data-quick-update="${c.id}" type="button">Salvar</button><button class="quick-close" data-quick-close type="button">&times;</button></div><div class="quick-menu"><button data-open-card="${c.id}" type="button">Ã¢â€“Â£ Abrir lancamento</button><button data-publish="${c.id}" type="button">Ã¢Ëœâ€˜ Marcar publicado</button><button data-toggle-run="${c.id}" type="button">${c.campaignState==='ativo'?'Ã¢â€“Â£ Desativar rodando':'Ã¢â€“Â£ Ativar rodando'}</button><button data-quick-duplicate="${c.id}" type="button">Ã¢Â§â€° Duplicar criativo</button><button data-quick-copy="${c.id}" type="button">Ã¢â€ â€” Copiar link</button><button data-quick-archive="${c.id}" type="button">Ã¢â€“Â¡ Arquivar</button></div></div></div>`;return`<div class="week-card" draggable="true" data-card="${c.id}" data-open-card="${c.id}"><button class="edit-pencil" data-quick-edit="${c.id}" type="button" title="Editar rapido">Ã¢Å“Å½</button><div class="board-card-head"><i class="net-dot ${netClass(c)}"></i><b>${esc(format)}</b><span>${esc(c.account||boardName(c.boardId))}</span></div>${visual?`<div class="board-card-media">${visual}</div>`:`<div class="board-card-text">${esc(note||c.title||'Criativo')}</div>`}<div class="board-card-foot"><span class="cal-time">${esc(time)}</span>${statusPill(c)}</div>${calendarLabels(c)?`<div class="cal-labels">${calendarLabels(c)}</div>`:''}</div>`}return`<div class="week-card" draggable="true" data-card="${c.id}" data-open-card="${c.id}" title="Clique para editar, arraste para trocar o dia, duplo clique para ativar/desativar"><div class="cal-main"><i class="net-dot ${netClas function renderSync(){$('#syncStatus').textContent=syncUrl?(localStorage.getItem(PENDING)==='1'?'pendente':'salvo'):'local'}function scheduleSave(){if(!syncUrl)return;clearTimeout(syncTimer);syncTimer=setTimeout(saveCloud,900)}function jsonp(url){return new Promise((res,rej)=>{const cb='cb_'+Date.now();const s=document.createElement('script');window[cb]=p=>{delete window[cb];s.remove();res(p)};s.onerror=rej;s.src=url+(url.includes('?')?'&':'?')+'callback='+cb+'&t='+Date.now();document.body.appendChild(s)})}async function saveCloud(){try{const payload={...state,lastSync:Date.now()};const r=await fetch(syncUrl,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({data:payload})});const j=await r.json();if(!j.ok)throw Error();state=normalize(j.data||payload);localStorage.setItem(STORE,JSON.stringify(state));localStorage.removeItem(PENDING);renderSync()}catch(e){localStorage.setItem(PENDING,'1');renderSync()}}async function loadCloud(){try{const r=await jsonp(syncUrl);if(r&&r.data&&+r.data.lastSync>+state.lastSync){state=normalize(r.data);localStorage.setItem(STORE,JSON.stringify(state));localStorage.removeItem(PENDING);render()}else if(localStorage.getItem(PENDING)==='1')saveCloud()}catch(e){renderSync()}}async function configSync(){const url=prompt('Cole a URL do Web App do Apps Script:',syncUrl);if(url===null)return;syncUrl=url.trim();if(syncUrl)localStorage.setItem(SYNC,syncUrl);else localStorage.removeItem(SYNC);if(syncUrl){localStorage.setItem(PENDING,'1');await saveCloud();await loadCloud()}renderSync()}

state.cards.find(x=>+x.id===openCardId);c.approvalStatus='aprovado';c.status='aprovado';save();render();openModal(c.id)}if(e.target.closest('[data-schedule-tomorrow]'))scheduleTomorrow();if(e.target.closest('[data-copy]')){const c=state.cards.find(x=>+x.id===openCardId),copy={...c,id:state.nextCardId++,title:c.title+' - copia',publishedAt:'',publishedTime:'',campaignState:'inativo'};state.cards.push(copy);save();render();openModal(copy.id)}if(e.target.closest('[data-archive]')){const c=state.cards.find(x=>+x.id===openCardId);c.archived=true;save();$('#modal').classList.add('hidden');render()}if(e.target.closest('[data-prev]')){calendarMode==='week'?plannerDate.setDate(plannerDate.getDate()-7):plannerDate.setMonth(plannerDate.getMonth()-1);render()}if(e.target.closest('[data-next]')){calendarMode==='week'?plannerDate.setDate(plannerDate.getDate()+7):plannerDate.setMonth(plannerDate.getMonth()+1);render()}if(e.target.closest('[data-today]')){plannerDate=new Date();render()}const mode=e.target.closest('[data-mode]');if(mode){calendarMode=mode.dataset.mode;render()}const mt=e.target.closest('[data-modal-tab]');if(mt){modalTab=mt.dataset.modalTab;$('#modal').dataset.tab=modalTab;return}if(e.target.closest('[data-history-all]')){showAllHistory=!showAllHistory;render();return}if(e.target.id==='themeBtn'){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save();render()}if(e.target.id==='syncBtn')configSync()});document.body.addEventListener('change',e=>{if(e.target.closest('#modal'))modalDirty=true;if(e.target.id==='calendarFilter'){calendarFilter=e.target.value;render()}if(e.target.id==='mMediaFile')readFile('#mMediaFile','#mMedia');if(e.target.id==='mStoryFile')readFile('#mStoryFile','#mStory');if(e.target.id==='mReelsFile')readFile('#mReelsFile','#mReels')});document.body.addEventListener('input',e=>{if(e.target.closest('#modal'))modalDirty=true;if(e.target.id==='mMedia'||e.target.id==='mLink'){$('#mPreview').innerHTML=preview({mediaUrl:$('#mMedia').value,link:$('#mLink').value})}});document.body.addEventListener('dblclick',e=>{const p=e.target.closest('[data-publish]');if(p){publish(p.dataset.publish);return}const c=e.target.closest('[data-card]');if(c)publish(c.dataset.card)});document.body.addEventListener('mouseover',e=>{const v=e.target.closest('[data-card]')?.querySelector('video');if(v){v.muted=true;v.play().catch(()=>{})}});document.body.addEventListener('mouseout',e=>{const card=e.target.closest('[data-card]');if(card&&!card.contains(e.relatedTarget)){const v=card.querySelector('video');if(v){v.pause();v.currentTime=0}}});document.body.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(c){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('card',c.dataset.card);c.classList.add('dragging');document.querySelector('.board-calendar')?.classList.add('dragging')}});document.body.addEventListener('dragend',e=>{e.target.closest('[data-card]')?.classList.remove('dragging');document.querySelector('.board-calendar')?.classList.remove('dragging')});document.body.addEventListener('dragover',e=>{if(e.target.closest('[data-day]')||e.target.closest('[data-drop-media]'))e.preventDefault()});document.body.addEventListener('drop',e=>{const drop=e.target.closest('[data-drop-media]');if(drop&&e.dataTransfer.files?.[0]){e.preventDefault();const f=e.dataTransfer.files[0],r=new FileReader();r.onload=()=>{$('#mMedia').value=r.result;$('#mPreview').innerHTML=preview({mediaUrl:r.result,link:$('#mLink')?.value||''});modalDirty=true};r.readAsDataURL(f);return}const id=e.dataTransfer.getData('card'),day=e.target.closest('[data-day]'),c=state.cards.find(x=>+x.id===+id);document.querySelector('.board-calendar')?.classList.remove('dragging');if(!c)return;if(day){const targetDay=day.dataset.day,existing=cards('board').filter(x=>+x.id!==+id&&displayDate(x)===targetDay);c.dueDate=targetDay;if(c.publishedAt)c.publishedAt=targetDay;c.status=c.publishedAt?'publicado':'agendado';c.order=existing.filter(x=>cardTime(x)<=cardTime(c)).length;selectedDate=c.dueDate}save();render()})}
function bindDayAdd(){document.body.addEventListener('click',e=>{if(e.target.closest('[data-today]'))selectedDate=iso(new Date());const day=e.target.closest('[data-day]');if(day&&!e.target.closest('[data-card]')&&!e.target.closest('[data-add-day]')){selectedDate=day.dataset.day;plannerDate=new Date(selectedDate+'T12:00:00');render();return}const add=e.target.closest('[data-add-day]');if(!add)return;selectedDate=add.dataset.addDay;createCard({boardId:activeScreen==='board'?state.activeBoardId:(calendarFilter==='all'?boards()[0]?.id:calendarFilter),dueDate:selectedDate});save();openModal(state.nextCardId-1)})}
bindQuick();bind();bindDayAdd();render();if(syncUrl)loadCloud();
})();
</script>
