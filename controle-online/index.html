function quickCardFromText(text,day){const raw=(text||'').trim();if(!raw)return null;const isUrl=/^https?:\/\//i.test(raw),soc=detect(isUrl?raw:''),dayCards=cards('board').filter(c=>displayDate(c)===day),card=createCard({boardId:activeScreen==='board'?state.activeBoardId:(calendarFilter==='all'?boards()[0]?.id:calendarFilter),dueDate:day,title:isUrl?(soc.format?`${soc.format} ${soc.platform}`:'Criativo colado'):raw,link:isUrl?raw:''});card.order=dayCards.length;selectedDate=day;return card}
function bindQuick(){document.body.addEventListener('click',e=>{const edit=e.target.closest('[data-quick-edit]');if(edit){e.preventDefault();e.stopPropagation();quickEditId=+edit.dataset.quickEdit;quickDay='';render();return}const close=e.target.closest('[data-quick-close]');if(close){e.preventDefault();e.stopPropagation();quickDay='';quickEditId=null;render();return}const add=e.target.closest('[data-add-day]');if(add&&activeScreen==='board'){e.preventDefault();e.stopPropagation();quickDay=add.dataset.addDay;quickEditId=null;selectedDate=quickDay;render();setTimeout(()=>document.querySelector(`[data-quick-day="${quickDay}"] textarea`)?.focus(),40);return}const saveQuick=e.target.closest('[data-quick-save]');if(saveQuick){e.preventDefault();e.stopPropagation();const day=saveQuick.dataset.quickSave,box=document.querySelector(`[data-quick-day="${day}"] textarea`),card=quickCardFromText(box?.value,day);if(card){quickDay='';quickEditId=null;save();render()}return}const update=e.target.closest('[data-quick-update]');if(update){e.preventDefault();e.stopPropagation();const card=state.cards.find(c=>+c.id===+update.dataset.quickUpdate),text=e.target.closest('.quick-edit')?.querySelector('textarea')?.value.trim();if(card&&text){if(/^https?:\/\//i.test(text)){card.link=text;const soc=detect(text);if(soc.platform)card.platform=soc.platform;if(soc.format){card.format=soc.format;card.title=`${soc.format} ${soc.platform}`}}else card.title=text;quickEditId=null;save();render()}return}const pubQuick=e.target.closest('.quick-menu [data-publish]');if(pubQuick){e.preventDefault();e.stopPropagation();quickEditId=null;publish(pubQuick.dataset.publish);return}const runQuick=e.target.closest('.quick-menu [data-toggle-run]');if(runQuick){e.preventDefault();e.stopPropagation();quickEditId=null;toggleRun(runQuick.dataset.toggleRun);return}const dup=e.target.closest('[data-quick-duplicate]');if(dup){e.preventDefault();e.stopPropagation();const c=state.cards.find(x=>+x.id===+dup.dataset.quickDup function hasPendingSync(){syncPending=syncPending||localStorage.getItem(PENDING_SYNC_KEY)==='1';return syncPending}function markLocalForCloud(){state.lastSync=Date.now();state.updatedAt=state.lastSync;setSyncPending(true);saveLocalSnapshot()}function syncEndpoint(action,extra=''){if(!syncUrl)return'';const sep=syncUrl.includes('?')?'&':'?';return syncUrl+sep+'action='+encodeURIComponent(action)+extra}function syncTime(ts=Date.now()){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function setSyncStatus(text){const el=$('#syncStatus');if(el)el.innerHTML=syncUrl?`<span class="sync-live-dot"></span>${esc(text)}`:esc(text)}function renderSync(){if(!syncUrl){setSyncStatus('Sync local');return}setSyncStatus(hasPendingSync()?'Sync pendente':state.lastSync?'Sync salvo '+syncTime(state.lastSync):'Sync conectando...')}function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}function loadCloudState(){return new Promise((resolve,reject)=>{if(!syncUrl)return resolve(null);setSyncStatus('Sync baixando...');const cb='criativosSyncCb_'+Date.now()+'_'+Math.floor(Math.random()*9999),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('Tempo esgotado ao confirmar sincronizacao.')),10000);function done(err,data){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)}window[cb]=payload=>done(null,payload&&payload.data?payload.data:payload);script.onerror=()=>done(new Error('Falha ao carregar sincronizacao.'));script.src=syncEndpoint('load','&callback='+encodeURIComponent(cb)+'&t='+Date.now());document.body.appendChild(script)})}function saveCloudApplyBackup(){try{localStorage.setItem(CLOUD_BACKUP_KEY,JSON.stringify({savedAt:Date.now(),data:statePayload()}))}catch(err){console.warn('Nao foi possivel criar backup antes da nuvem.',err)}}function applyCloudState(data){if(!data||!Array.isArray(data.cards)||!Array.isArray(data.workspaces))return false;saveCloudApplyBackup();applyingRemote=true
