<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dualize Digital</title>
<style>
:root{
  --bg:#070b12;
  --panel:#111824;
  --panel-2:#172131;
  --text:#f7fbff;
  --muted:#9aa8bd;
  --line:#263449;
  --blue:#82bcff;
  --green:#70d6a2;
  --purple:#8f6bff;
  --amber:#f2bc66;
  --red:#ff6b73;
  --shadow:0 24px 80px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0,rgba(143,107,255,.22),transparent 34rem),
    radial-gradient(circle at 95% 10%,rgba(112,214,162,.16),transparent 30rem),
    linear-gradient(135deg,#111a2a 0,#070b12 48%,#05070c 100%);
}
button,a{font:inherit}
.app{
  min-height:100vh;
  width:min(1320px,100%);
  margin:auto;
  padding:28px 28px 42px;
  display:grid;
  grid-template-rows:auto 1fr;
  gap:22px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:18px;
}
.brand{
  display:flex;
  align-items:center;
  min-width:0;
}
.brand-logo{
  width:min(510px,46vw);
  max-height:170px;
  object-fit:contain;
  object-position:left center;
  filter:
    drop-shadow(0 0 20px rgba(130,188,255,.28))
    drop-shadow(0 0 34px rgba(112,214,162,.18));
  animation:logoGlow 4.8s ease-in-out infinite;
}
.statusbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.pill{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(17,24,36,.74);
  color:var(--text);
  border-radius:999px;
  padding:11px 15px;
  font-weight:950;
  white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}
.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:99px;
  background:var(--green);
  box-shadow:0 0 18px var(--green);
  margin-right:8px;
}
.hero{
  display:grid;
  gap:24px;
  align-content:start;
}
.hero-brand{
  min-height:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px 0 4px;
  position:relative;
}
.hero-brand:before{
  content:"";
  position:absolute;
  width:min(620px,82vw);
  height:190px;
  border-radius:999px;
  background:radial-gradient(circle,rgba(130,188,255,.18),rgba(112,214,162,.10) 38%,transparent 72%);
  filter:blur(16px);
}
.hero-logo{
  position:relative;
  width:min(700px,78vw);
  max-height:230px;
  object-fit:contain;
  filter:
    drop-shadow(0 0 22px rgba(255,255,255,.16))
    drop-shadow(0 0 46px rgba(130,188,255,.24))
    drop-shadow(0 0 60px rgba(112,214,162,.16));
  animation:logoFloat 6s ease-in-out infinite;
}
.module-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  perspective:1200px;
}
.module-card{
  position:relative;
  overflow:hidden;
  min-height:286px;
  border:1px solid transparent;
  border-radius:30px;
  padding:24px;
  background:
    radial-gradient(circle at 18% 8%,rgba(255,255,255,.12),transparent 38%),
    linear-gradient(150deg,rgba(22,31,48,.96),rgba(12,19,30,.94)) padding-box,
    linear-gradient(135deg,rgba(143,107,255,.95),rgba(130,188,255,.78),rgba(112,214,162,.66)) border-box;
  box-shadow:0 24px 70px rgba(0,0,0,.44),0 0 34px rgba(255,255,255,.06);
  cursor:pointer;
  text-align:left;
  color:var(--text);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:24px;
  transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;
}
.module-card:before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:29px;
  pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.18) inset;
}
.module-card:after{
  content:"";
  position:absolute;
  inset:auto 18px -46px 18px;
  height:80px;
  border-radius:50%;
  background:linear-gradient(90deg,rgba(143,107,255,.25),rgba(130,188,255,.16),rgba(112,214,162,.22));
  filter:blur(22px);
  pointer-events:none;
}
.module-card:hover{
  animation:none;
  transform:translateY(-7px) rotateX(1.5deg);
  box-shadow:0 0 0 1px rgba(255,255,255,.72) inset,0 0 42px rgba(255,255,255,.18),var(--shadow);
  filter:saturate(1.08);
}
.module-card:nth-child(1){animation:cardFloat 6.8s ease-in-out infinite}
.module-card:nth-child(2){animation:cardFloat 7.2s ease-in-out .7s infinite}
.module-card:nth-child(3){animation:cardFloat 6.5s ease-in-out 1.25s infinite}
.module-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.module-icon{
  width:62px;
  height:62px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--green));
  color:#071018;
  box-shadow:0 0 0 1px rgba(255,255,255,.62) inset,0 18px 44px rgba(112,214,162,.18);
}
.module-icon svg{
  width:34px;
  height:34px;
  stroke:currentColor;
  stroke-width:2.2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.module-icon .fill-icon{fill:currentColor;stroke:none}
.module-badge{
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:8px 10px;
  background:rgba(255,255,255,.05);
  color:var(--green);
  font-size:11px;
  font-weight:950;
}
.module-card h3{
  margin:0;
  font-size:29px;
  letter-spacing:-.4px;
  color:transparent;
  background:linear-gradient(135deg,#f7fbff 8%,var(--blue) 48%,var(--green) 92%);
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 24px rgba(130,188,255,.18);
}
.module-card p{
  margin:10px 0 0;
  color:#b9d1ef;
  font-weight:760;
  line-height:1.45;
}
.module-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.module-metric{
  color:#d7fff0;
  font-size:15px;
  font-weight:950;
  text-shadow:0 0 18px rgba(112,214,162,.18);
}
.open-chip{
  color:#071018;
  background:linear-gradient(135deg,var(--blue),var(--green));
  border-radius:999px;
  padding:10px 13px;
  font-size:12px;
  font-weight:1000;
}
.summary{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px;
}
.panel{
  border:1px solid transparent;
  border-radius:28px;
  padding:22px;
  background:
    linear-gradient(rgba(17,24,36,.84),rgba(17,24,36,.84)) padding-box,
    linear-gradient(135deg,rgba(143,107,255,.8),rgba(130,188,255,.58),rgba(112,214,162,.44)) border-box;
  box-shadow:0 18px 55px rgba(0,0,0,.24);
}
.panel:hover{
  box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 22px 62px rgba(0,0,0,.28);
}
.panel h3{
  margin:0 0 14px;
  font-size:20px;
  color:transparent;
  background:linear-gradient(135deg,var(--blue),var(--green) 55%,#f4f8ff);
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 26px rgba(130,188,255,.22);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.kpi{
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
}
.kpi span{
  display:block;
  color:#89c7ff;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:950;
  text-shadow:0 0 18px rgba(130,188,255,.24);
}
.kpi strong{
  display:block;
  margin-top:10px;
  font-size:24px;
  color:transparent;
  background:linear-gradient(135deg,#ffffff 0,var(--green) 44%,var(--blue) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 28px rgba(112,214,162,.18);
}
.kpi small{
  display:block;
  margin-top:7px;
  color:#b8c9e4;
  font-weight:800;
}
.activity{
  display:grid;
  gap:10px;
}
.activity-line{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  padding:12px 14px;
  background:rgba(255,255,255,.04);
  color:#b8c9e4;
  font-weight:850;
}
.activity-line b{
  color:transparent;
  background:linear-gradient(135deg,var(--blue),var(--green));
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 18px rgba(130,188,255,.22);
}
.activity-line span{
  color:#f2c777;
  text-shadow:0 0 18px rgba(242,188,102,.16);
}
.workspace{
  position:fixed;
  inset:18px;
  z-index:20;
  display:none;
  grid-template-rows:auto 1fr;
  border:1px solid transparent;
  border-radius:28px;
  overflow:hidden;
  background:
    linear-gradient(#0e141f,#0e141f) padding-box,
    linear-gradient(135deg,var(--purple),var(--blue),var(--green)) border-box;
  box-shadow:0 28px 100px rgba(0,0,0,.65),0 0 42px rgba(255,255,255,.18);
}
.workspace.active{display:grid}
.workspace-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:rgba(10,15,24,.88);
  border-bottom:1px solid rgba(255,255,255,.10);
}
.workspace-head b{font-size:18px}
.workspace-actions{display:flex;gap:8px;flex-wrap:wrap}
.action{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:var(--text);
  border-radius:999px;
  padding:9px 12px;
  text-decoration:none;
  font-weight:950;
  font-size:12px;
  cursor:pointer;
}
.action.primary{background:linear-gradient(135deg,var(--blue),var(--green));color:#071018}
.frame-wrap{position:relative;min-height:0}
.frame-wrap.loading:before{
  content:"Carregando módulo...";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:var(--muted);
  background:#0e1117;
  z-index:2;
  font-weight:950;
}
iframe{
  width:100%;
  height:100%;
  border:0;
  background:#0e1117;
}
@media(max-width:1050px){
  .module-grid,.summary,.kpis{grid-template-columns:1fr}
  .app{padding:18px}
  .top{flex-direction:column}
  .statusbar{justify-content:flex-start}
  .brand-logo{width:min(420px,84vw)}
  .hero-brand{min-height:130px}
  .hero-logo{width:min(560px,90vw)}
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 20px rgba(130,188,255,.22)) drop-shadow(0 0 34px rgba(112,214,162,.16))}
  50%{filter:drop-shadow(0 0 30px rgba(130,188,255,.42)) drop-shadow(0 0 54px rgba(112,214,162,.28))}
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.012)}
}
@keyframes cardFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@media(prefers-reduced-motion:reduce){
  .brand-logo,.hero-logo,.module-card{animation:none!important}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="dualize-logo.png" alt="Dualize Digital">
    </div>
    <div class="statusbar">
      <div class="pill"><span class="dot"></span><span id="syncStatus">Conectando Firebase...</span></div>
      <div class="pill" id="todayPill"></div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-brand" aria-label="Dualize Digital - painel geral de módulos">
      <img class="hero-logo" src="dualize-logo.png" alt="Dualize Digital">
    </div>

    <div class="module-grid" id="moduleCards"></div>

    <div class="summary">
      <section class="panel">
        <h3>Resumo ao vivo</h3>
        <div class="kpis">
          <div class="kpi"><span>Financeiro</span><strong id="financeEntries">--</strong><small id="financeSync">Aguardando Firestore</small></div>
          <div class="kpi"><span>Cartões</span><strong id="financeCards">--</strong><small>Transações importadas</small></div>
          <div class="kpi"><span>Tarefas</span><strong id="taskCards">--</strong><small id="taskSync">Aguardando Firestore</small></div>
          <div class="kpi"><span>Calculadora de LEADs</span><strong>Pronta</strong><small>Módulo disponível</small></div>
        </div>
      </section>

      <section class="panel">
        <h3>Últimas atividades</h3>
        <div class="activity">
          <div class="activity-line"><b>Firebase</b><span id="activitySync">Aguardando dados</span></div>
          <div class="activity-line"><b>Financeiro</b><span id="activityFinance">Conectando</span></div>
          <div class="activity-line"><b>Tarefas</b><span id="activityTasks">Conectando</span></div>
        </div>
      </section>
    </div>
  </section>
</main>

<section class="workspace" id="workspace">
  <div class="workspace-head">
    <b id="workspaceTitle">Módulo</b>
    <div class="workspace-actions">
      <button class="action" id="closeWorkspace" type="button">Voltar</button>
      <button class="action" id="reloadFrame" type="button">Recarregar</button>
      <a class="action primary" id="openExternal" target="_blank" rel="noopener">Abrir em tela cheia</a>
    </div>
  </div>
  <div class="frame-wrap loading" id="frameWrap">
    <iframe id="moduleFrame" title="Módulo Dualize"></iframe>
  </div>
</section>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAryTmLH5_kYevS2Zt3csh9eUlA7whkLdE",
  authDomain:"dualize-projeto.firebaseapp.com",
  projectId:"dualize-projeto",
  storageBucket:"dualize-projeto.firebasestorage.app",
  messagingSenderId:"1098441288739",
  appId:"1:1098441288739:web:8e210b6d329ee779bc1596"
};
const modules=[
  {id:'financeiro',icon:'finance',title:'Financeiro',desc:'Lançamentos, cartões, bancos, terceiros e planejamento.',url:'financeiro.html',status:'Tempo real Firebase',metric:'Controle mensal'},
  {id:'tarefas',icon:'control',title:'Tarefas',desc:'Quadro operacional, criativos, rotinas e calendário de clientes.',url:'controle-online/index.html',status:'Tempo real Firebase',metric:'Operação diária'},
  {id:'leads',icon:'calculator',title:'Calculadora de LEADs',desc:'Fórmula do lead qualificado e simulações comerciais.',url:'calculadora-lead/index.html',status:'Módulo comercial',metric:'Simulador'}
];
const $=s=>document.querySelector(s);
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function syncTime(ts){return new Date(ts||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function moduleIcon(type){
  const icons={
    finance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M17 7.5c-.9-1.1-2.4-1.7-4.3-1.7-2.4 0-4 .9-4 2.6 0 4.1 8.6 1.8 8.6 6.1 0 1.8-1.7 3-4.4 3-2.2 0-4-.7-5-2"/></svg>',
    control:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7"/><path d="M15 7h5"/><path d="M9 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0Z"/><path d="M4 17h3"/><path d="M11 17h9"/><path d="M7 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0Z"/></svg>',
    calculator:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8"/><path d="M8 11h.01"/><path d="M12 11h.01"/><path d="M16 11h.01"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/><path d="M8 18h.01"/><path d="M12 18h4"/></svg>'
  };
  return icons[type]||icons.control;
}
function renderModules(){
  $('#moduleCards').innerHTML=modules.map(m=>`<button class="module-card" type="button" data-module="${m.id}">
    <div class="module-top"><div class="module-icon">${moduleIcon(m.icon)}</div><span class="module-badge">${esc(m.status)}</span></div>
    <div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p></div>
    <div class="module-footer"><span class="module-metric">${esc(m.metric)}</span><span class="open-chip">Abrir módulo</span></div>
  </button>`).join('');
}
function openModule(id){
  const mod=modules.find(m=>m.id===id)||modules[0];
  $('#workspaceTitle').textContent=mod.title;
  $('#openExternal').href=mod.url;
  $('#workspace').classList.add('active');
  $('#frameWrap').classList.add('loading');
  $('#moduleFrame').src=mod.url+(mod.url.includes('?')?'&':'?')+'embedded=1&t='+Date.now();
}
function setupEvents(){
  document.body.addEventListener('click',e=>{
    const target=e.target.closest('[data-module]');
    if(target) openModule(target.dataset.module);
  });
  $('#closeWorkspace').onclick=()=>$('#workspace').classList.remove('active');
  $('#reloadFrame').onclick=()=>{
    const frame=$('#moduleFrame');
    $('#frameWrap').classList.add('loading');
    frame.src=frame.src;
  };
  $('#moduleFrame').onload=()=>$('#frameWrap').classList.remove('loading');
}
function setupFirebaseSummary(){
  try{
    firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();
    db.collection('painel_financeiro').doc('estado_principal').onSnapshot(snapshot=>{
      if(!snapshot.exists){
        $('#syncStatus').textContent='Firebase pronto';
        return;
      }
      const data=snapshot.data();
      const payload=data.payload||data;
      const when=syncTime(payload.lastSync||data.updatedAt);
      $('#syncStatus').textContent='Firebase ao vivo '+when;
      $('#financeEntries').textContent=Array.isArray(payload.entries)?payload.entries.length:'0';
      $('#financeCards').textContent=Array.isArray(payload.cardTransactions)?payload.cardTransactions.length:'0';
      $('#financeSync').textContent='Atualizado '+when;
      $('#activitySync').textContent='Ao vivo '+when;
      $('#activityFinance').textContent='Atualizado '+when;
    },err=>{
      console.warn(err);
      $('#syncStatus').textContent='Firebase indisponível';
    });
    db.collection('tarefas').doc('estado_principal').onSnapshot(snapshot=>{
      if(!snapshot.exists)return;
      const data=snapshot.data();
      const payload=data.payload||data;
      const when=syncTime(payload.lastSync||data.updatedAt);
      $('#taskCards').textContent=Array.isArray(payload.cards)?payload.cards.length:'0';
      $('#taskSync').textContent='Atualizado '+when;
      $('#activityTasks').textContent='Atualizado '+when;
    });
  }catch(err){
    console.warn(err);
    $('#syncStatus').textContent='Firebase erro';
  }
}
$('#todayPill').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
renderModules();
setupEvents();
setupFirebaseSummary();
</script>
</body>
</html>
